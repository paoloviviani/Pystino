# Deliberately NOT a member of the root uv workspace.
#
# Presidio pulls in spaCy, which pulls in a numerical stack and hundreds of
# megabytes of model weights. Making this a workspace member would put all of it
# in the gateway's lockfile and in every developer's environment, and would quietly
# make "the gateway depends on Presidio" true in the one place it must not be.
#
# The gateway depends on the *contract* (packages/shared-py). This project is one
# implementation of it.
[project]
name = "llmp-redaction"
version = "0.1.0"
description = "PII detection service: spans in, spans out. A reference implementation of the llmp detection contract."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.42,<0.43",
    "orjson>=3.11,<4",
    # Presidio is MIT. The spaCy *models* are licensed separately, and that is
    # the part that matters.
    "presidio-analyzer>=2.2.363,<3",
    # Text out of attached documents, so detection has something to read
    # (llmp_redaction/documents.py). MIT, checked at source on 2026-09-06.
    #
    # One entry point over four libraries, chosen for maintainability: a single
    # upstream to track and one API instead of a per-format branch. The extras
    # are named rather than taking `[all]`, which would add Azure clients,
    # YouTube transcripts and audio transcription to a PII detector.
    #
    # `[xls]` is not redundant with `[xlsx]`: it covers the pre-2007 OLE format,
    # which the per-format libraries could not read at all.
    #
    # PyMuPDF is deliberately absent from this tree: AGPL-3.0 or commercial,
    # which is a decision for whoever deploys this rather than a dependency to
    # acquire quietly (ADR 0001).
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.7,<0.2",
    # Encodes the rendered page images (llmp_redaction/documents.py). Already in the
    # tree via python-pptx; named because it is imported directly. MIT-CMU (HPND).
    "pillow>=11,<13",
    "llmp-shared",
    "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
# Scan reading for the default markitdown engine: RapidOCR (Apache-2.0) running
# PaddleOCR's PP-OCRv5 models (Apache-2.0) on onnxruntime (MIT). Selected at
# build time (`--build-arg EXTRACTOR=ocr`) so the default image stays small.
ocr = [
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.20,<2",
]
# The Docling engine (docs/extractor-engines.md): layout, reading order and
# tables, with RapidOCR for scans. Code is MIT; torch is CPU-only (see
# tool.uv.sources). Includes everything `ocr` does.
docling = [
    "llmp-redaction[ocr]",
    "docling>=2.149,<3",
    "huggingface-hub>=0.23",
    # Named here because tool.uv.sources applies only to direct dependencies;
    # left to docling's own requirement, uv resolves the CUDA wheel.
    "torch>=2.2.2,<3",
    "torchvision>=0.17,<1",
]
# The Italian NER model is NOT here: it is CC BY-NC-SA 3.0 and is added by a
# Docker build argument, so the licence choice is explicit and per-deployment.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.7",
    "mypy>=1.13",
    # Only to *build* the fixtures the extractor tests read: a real .docx has to
    # be written by something, and markitdown converts rather than authors.
    # openpyxl and python-pptx arrive with the runtime extras above; python-docx
    # does not, because markitdown reads Word through mammoth.
    "python-docx>=1.2,<2",
    # Authors the synthetic PDFs (two-column report with a table, image-only
    # scan page) the Docling and OCR tests read. BSD-3-Clause.
    "reportlab>=4.2,<5",
]

[tool.uv.sources]
llmp-shared = { path = "../../packages/shared-py", editable = true }
# The default torch wheel on Linux is the CUDA build, gigabytes of libraries a
# CPU-only extractor never loads.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmp_redaction"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
