# ToolHive: MCP connectors, and who holds their credentials (ADR 0063).
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml \
#     -f deploy/compose/docker-compose.proxy.yml \
#     -f deploy/compose/docker-compose.keycloak.yml \
#     -f deploy/compose/docker-compose.chat.yml \
#     -f deploy/compose/docker-compose.toolhive.yml up -d
#
# ToolHive is to connectors what the gateway is to models: it holds the
# counterparty's OAuth credential and hands the client one of its own. The
# chat therefore stops keeping third-party bearer tokens in `localStorage`,
# which is what it does today and the actual reason this is here.
#
# ## Against the fourth ground rule: nothing new is published
#
# No `ports:`. ToolHive listens on the compose network and reaches a browser
# through Caddy on the origin that is already published. Its own startup
# warning is the reason as much as the rule is:
#
#   "API server Origin validation is disabled for this bind address;
#    cross-origin browser requests are not rejected at this layer. Front a
#    non-loopback listener with a reverse proxy that enforces Origin."
#
# ## Unauthenticated it is not a service, it is an open door
#
# The other startup warning, and this one is not a style note:
#
#   "no authentication configured: the proxy will accept every request
#    unauthenticated and assign each a synthetic local-user identity with no
#    token or credential check"
#
# So the `--oidc-*` flags below are load-bearing. They point at the same
# Keycloak issuer and the same `pystino-api` audience the gateway already
# validates (ADR 0040), which is the point: a caller presents one access token
# and it works for models and for connectors. No new Keycloak client is
# needed — ToolHive is a resource server here, validating tokens minted for an
# audience that already exists, not obtaining any.
#
# ## The Docker socket, which is the real cost
#
# `thv serve` refuses to start with `no container runtime available` before it
# parses anything — measured: even `serve --help` fails without it — and the
# check does not care that we only want *remote* MCP servers, which spawn no
# container at all. So it gets the socket, and that is root-equivalent control
# of this host handed to a service.
#
# It is **not** mounted `:ro`, and that is deliberate rather than sloppy: the
# Docker API is spoken *over* the socket, so read-only on the socket file
# prevents nothing an attacker would want. Writing `:ro` would only buy the
# appearance of a mitigation. Accepted for a development stack; ADR 0063
# records that the Kubernetes operator is the shape that avoids it and that
# this must be revisited before anything production-shaped.
#
# ## State
#
# A named volume, because the embedded authorization server's dynamic client
# registrations are cached — keyed on `(issuer, redirect_uri, scopes_hash)` —
# and losing them on restart means re-registering with every upstream
# provider. Secrets live here too.

services:
  toolhive:
    image: ghcr.io/stacklok/toolhive:latest
    restart: unless-stopped
    # Root, because it needs the Docker socket and the image's own user
    # (65532) cannot read it. Named here rather than left implicit: it is the
    # same decision as the socket itself, and hiding it in a group id would
    # not make it smaller.
    user: "0"
    command:
      - serve
      # 0.0.0.0 inside the container, published nowhere: Caddy is the only
      # thing on this network that talks to it.
      - --host=0.0.0.0
      - --port=8080
      # The API surface the chat drives. Kept on so the shape of
      # `/api/v1beta/workloads` and `remoteOAuthConfig` is readable from the
      # running service rather than from a version of the docs that may not
      # match the image.
      - --openapi
      - --oidc-issuer=${GATEWAY_OIDC__ISSUER:?set GATEWAY_OIDC__ISSUER in deploy/.env}
      - --oidc-audience=${GATEWAY_OIDC__ACCESS_TOKEN_AUDIENCE:-pystino-api}
      # Discovery from the issuer, and no `--oidc-jwks-url`. That flag was
      # tried and is what broke it, measured across three instances with one
      # token:
      #
      #   issuer only (public https)          accepts the token
      #   issuer + https JWKS url             accepts the token
      #   issuer + http internal JWKS url     "failed to lookup JWKS:
      #                                        resource ... is not ready"
      #
      # ToolHive will not use a plain-http JWKS resource. The internal URL was
      # only an attempt to dodge the internal-CA problem, which SSL_CERT_FILE
      # below already solves — so discovery is both simpler and the same
      # single value the gateway is given.
      #
      # The symptom deserves its own note: that error arrives inside a 401
      # whose body is otherwise identical to a bad token, while the URL in it
      # answers 200 to curl from inside this container's own network
      # namespace. Nothing in it points at the scheme.
    environment:
      # No Sentry. `--sentry-traces-sample-rate` defaults to 1 and the DSN
      # falls back to this variable, so leaving it unset is what keeps this
      # deployment from reporting anywhere. Set empty rather than absent to
      # say it was considered.
      SENTRY_DSN: ""
      # Caddy's own root, because the issuer is served under `tls internal` —
      # a CA nothing has heard of. The gateway needs the same thing and calls
      # it `SSL_CERT_FILE`; the chat needs it and calls it
      # `NODE_EXTRA_CA_CERTS`. ToolHive is Go, which honours `SSL_CERT_FILE`.
      #
      # Note the asymmetry with Python's: Go *replaces* the system pool with
      # this file rather than adding to it, so this bundle has to be
      # sufficient on its own for anything else ToolHive dials — which for a
      # remote MCP server on the public internet it is not. That is a real
      # limit of this shape and ADR 0063 records it: a connector reached over
      # a public CA needs the system roots appended to this file, which is
      # what `deploy/keycloak/setup.sh` already does for Caddy's root.
      SSL_CERT_FILE: /etc/ssl/caddy/caddy-root.crt
      # Where ToolHive keeps workloads, logs and cached registrations. It
      # defaults to `$HOME/.local/share/toolhive`, which is the container's own
      # layer — so the volume below was mounted and stayed empty while every
      # workload definition died with the container. Found by creating one.
      XDG_DATA_HOME: /data
    # The OAuth callback, reachable on the host's loopback only.
    #
    # `--remote-auth-callback-port` exists and a callback *host* flag does not,
    # so the redirect URI is always `http://localhost:<port>/callback` —
    # localhost relative to this container. Somebody authorising a connector
    # from another machine therefore needs an SSH tunnel, which is the same
    # thing the README documents for reaching the console.
    #
    # The port published here is the **forwarder's** (8667), not the callback's
    # (8666): the callback binds `127.0.0.1:8666` *inside* this container —
    # measured with `ss -ltnp` in its namespace — and a published port forwards
    # to the container's external interface, so publishing 8666 answered
    # nothing at all. See the `toolhive-callback` service below.
    #
    # 127.0.0.1 on the host side, so this publishes nothing on the routable
    # address: ground rule 4, and `test_public_tls_live.py` is what checks it.
    ports:
      - "127.0.0.1:${TOOLHIVE_CALLBACK_PORT:-8666}:8667"
    volumes:
      - toolhive-state:/data
      # The directory, not the file — a bind mount of a not-yet-existing file
      # becomes a directory, which is the trap the chat overlay documents.
      - ../tls:/etc/ssl/caddy:ro
      # See the header. This is the cost of the feature, not an oversight.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      keycloak:
        condition: service_started

  # Bridges the published port to the callback server's loopback address.
  #
  # It shares ToolHive's network namespace (`network_mode: service:toolhive`),
  # which is what lets it reach `127.0.0.1:8666` at all, and is also why the
  # port above is declared on ToolHive rather than here — in a shared namespace
  # there is one set of published ports.
  #
  # The alternative was `--network host` for ToolHive, which would put its API
  # and every workload proxy on the host's interfaces. That is the opposite of
  # what ground rule 4 asks for, to solve a problem eight lines fix.
  toolhive-callback:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: "service:toolhive"
    command: >-
      TCP-LISTEN:8667,fork,reuseaddr
      TCP:127.0.0.1:${TOOLHIVE_CALLBACK_PORT:-8666}
    depends_on:
      toolhive:
        condition: service_started

  proxy:
    volumes:
      - ../caddy/conf.d-toolhive/30-toolhive.caddy:/etc/caddy/conf.d/30-toolhive.caddy:ro

volumes:
  toolhive-state:
