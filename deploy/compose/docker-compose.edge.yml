# The NetBird edge shape: the origin router in plain HTTP, published on
# loopback only, with TLS terminated upstream at the edge.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml \
#     -f deploy/compose/docker-compose.chat.yml \
#     -f deploy/compose/docker-compose.edge.yml up -d --build
#
# ## Where TLS is
#
# Not here. The NetBird reverse proxy terminates it for the public name and
# forwards to this box's `localhost:8443` over the overlay — which is why
# this file publishes the proxy on **127.0.0.1** and still counts as
# loopback-only under the fourth ground rule: the edge is the deliberate
# public act, and this listener is reachable from nothing the host does not
# already trust. `scripts/test_public_tls_live.py` still asserts that nothing
# but 8443 answers on a routable address.
#
# ## The cookie is still `Secure`
#
# GATEWAY_SESSION_COOKIE_SECURE defaults to *true* (the shape assumes the
# browser's door is TLS); this deployment sets it false, see the gateway
# service below for why the NetBird shape wants it so.
# edge is HTTPS, so the cookie is set and sent over TLS and the plain hop
# between edge and gateway is inside one host. The IdP's issuer is the public
# https origin (deploy/.env), so every URL the deployment advertises is the
# address the world uses, and the forwarded-proto headers below are what make
# the gateway agree with it.
#
# ## The minting paths are refused at the edge
#
# The Caddyfile.netbird shape answers 404 on `/oauth/token`, `/auth/token`
# and `/auth/revoke` — ADR 0068's second layer. A standards client never
# comes here anyway: discovery advertises the compose-internal token URL.
#
# ## The overlays this replaces
#
# Not the proxy overlay: that one terminates TLS itself, for deployments
# where the box holds the certificate. This is the shape for a box that never
# sees a certificate at all — the edge holds it.
services:
  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      # 443 is the *internal* TLS listener: the box's own services resolve
      # the public name to this proxy (the alias below) and speak https to
      # it, because the issuer URL is https everywhere. The certificate is
      # Caddy's internal CA, whose root the chat trusts by mount — this is
      # transport inside the compose network, not a second public door.
      # 8443 is the edge's plain-HTTP hop.
      #
      # **0.0.0.0, by the operator's decision.** The fourth ground rule says
      # loopback-only; the amendment this box adds is a fact and not an
      # exception to argue: the box holds no routable address — its LAN
      # address is behind the site's NAT and the world's only way in is the
      # NetBird edge — and the edge's reverse-proxy peers reach this box over
      # paths a loopback bind does not cover. The public act remains the
      # edge's TLS. `scripts/test_public_tls_live.py` loses its teeth on a
      # shape like this and is not run against it; the firewall that matters
      # is the site's, not this host's.
      - "443:443"
      - "8443:8443"
    networks:
      default:
        # This box cannot hairpin to its own public name, and services
        # inside the network must still fetch from the issuer URL (the
        # chat's discovery is the one that matters). The alias answers that
        # name on the compose network, at the internal TLS listener above.
        aliases:
          - cerea.pviviani.eu
    environment:
      # No PUBLIC_ORIGIN here on purpose: the Caddyfile.netbird site address
      # is a bare :8443, because naming the https origin would make Caddy try
      # to obtain a certificate for it, which is the edge's job.
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.org}
    volumes:
      - ../caddy/Caddyfile.netbird:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    ports:
      # Same operator decision as the proxy above: published on every
      # interface, because the box's addresses are all private and the edge
      # is the only door. Direct API access from a NetBird peer (opencode, a
      # script) rides this, not the edge's path routing.
      !override
      - "8000:8000"
    environment:
      # uvicorn trusts 127.0.0.1 for forwarded headers by default; the proxy
      # reaches the gateway from the compose network, so without this every
      # X-Forwarded-* from it is discarded and the app believes the request
      # arrived over http. The IdP's /authorize and the session cookie both
      # build URLs from what the request looked like, so the forwarded proto
      # must be believed. Docker's own bridge range, plus the published
      # loopback port the live scripts use.
      FORWARDED_ALLOW_IPS: "172.16.0.0/12,127.0.0.1"
      # Secure by default, because the shape assumes the browser's door is
      # TLS (the edge terminates it). **This deployment sets it false**
      # (deploy/.env): the browser's door is the NetBird overlay — whose
      # transport is wireguard-encrypted end to end — and a proxy front that
      # answers plain http would silently drop a Secure cookie, producing
      # exactly "the login succeeds and lands me back on the login page"
      # with nothing in any log. The overlay is a private network; the
      # cookie's confidentiality rides the tunnel, and this box has no other
      # door.
      GATEWAY_SESSION_COOKIE_SECURE: ${GATEWAY_SESSION_COOKIE_SECURE:-true}
      # Local email + password sign-in (ADR 0043) — the bootstrap door for the
      # first administrator; the password comes from deploy/.env, which is the
      # shape the feature assumes.
      GATEWAY_LOCAL_AUTH__ENABLED: ${GATEWAY_LOCAL_AUTH__ENABLED:-true}

  # Only present when docker-compose.redaction.yml is also passed, which is
  # the usual combination. That file publishes the fake upstream so the
  # redaction check can read what the gateway sent — loopback only here,
  # which is the whole rule.
  fake-upstream:
    ports:
      !override
      - "8081:9099"

volumes:
  caddy-data:
  caddy-config:
