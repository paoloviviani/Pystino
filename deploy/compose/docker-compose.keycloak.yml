# Overlay that adds Keycloak as an identity provider and points the gateway at it.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.keycloak.yml up --build
#
#   ./scripts/test_oidc_flow.sh     # drives the whole login flow and checks it
#
# Keycloak admin console: http://localhost:8080  (admin / admin)
# Seeded users are described in deploy/keycloak/realm-llm-platform.json.
#
# Development only. Keycloak runs with `start-dev` (in-memory H2, no TLS) and the
# realm ships plaintext credentials, which is the point: one command gets you a
# working IdP. A production deployment needs its own database, TLS, and real
# secrets.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # There are two names for this Keycloak — `localhost:8080` from a browser on
      # the host, `keycloak:8080` from inside the compose network — and an ID
      # token's `iss` is compared byte-for-byte against the discovery document, so
      # the two must not disagree.
      #
      # Keycloak separates the two roles, which is what makes this work without
      # anyone editing /etc/hosts:
      #
      #   frontend   browser-facing URLs (authorization endpoint) and the `iss`
      #              claim. Pinned to the public name, because a browser is the one
      #              client that cannot resolve compose-internal DNS.
      #   backchannel  URLs the gateway calls directly (token, JWKS, userinfo).
      #              Left dynamic, so they follow the host the request arrived on —
      #              `keycloak:8080` for the gateway.
      #
      # Pinning the frontend to the *internal* name instead is the trap: token
      # validation then works, but the browser is redirected somewhere it cannot
      # reach.
      #
      # The port follows KEYCLOAK_PORT so that a laptop with something already
      # on 8080 is a one-variable fix rather than a dead end. Set the same
      # number on both ends and the browser, the tunnel and the `iss` claim all
      # still agree:
      #
      #   KEYCLOAK_PORT=18080 docker compose ... up -d
      #   ssh -L 18080:localhost:18080 -L 8000:localhost:8000 ubuntu@<host>
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/realm-llm-platform.json:/opt/keycloak/data/import/realm-llm-platform.json:ro
    ports:
      # Loopback only, and this one matters more than the gateway's: `start-dev`
      # serves the admin console with admin/admin.
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # The management port (9000) serves health in Keycloak 25+. curl is not in
      # the image, so this uses the JVM-free /bin/bash TCP trick via exec.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  gateway:
    environment:
      GATEWAY_OIDC__ENABLED: "true"
      # The gateway reaches Keycloak over the compose network; this matches
      # KC_HOSTNAME above so the discovered issuer and the token's `iss` agree.
      GATEWAY_OIDC__ISSUER: http://keycloak:8080/realms/llm-platform
      GATEWAY_OIDC__CLIENT_ID: llm-gateway
      GATEWAY_OIDC__CLIENT_SECRET: gateway-dev-secret-not-for-production
      # Where the *browser* is sent back to, so this is the gateway's public URL.
      GATEWAY_OIDC__REDIRECT_URI: http://localhost:8000/auth/callback
      GATEWAY_OIDC__GROUPS_CLAIM: groups
      # Accepts OIDC access tokens on /v1 for this audience, which is what the
      # chat application and the opencode device flow use instead of an API key
      # (ADR 0040). Naming an audience is what enables the feature: a token is
      # accepted only if the realm put this value in its `aud`, which the
      # `gateway-api` client scope does for the clients allowed to call /v1.
      GATEWAY_OIDC__ACCESS_TOKEN_AUDIENCE: llm-gateway
      # Membership of this realm group grants is_admin, in both directions:
      # leaving it removes admin at the next login.
      GATEWAY_OIDC__ADMIN_GROUPS: '["platform-admins"]'
      # Plain http locally, so the session cookie must not be Secure-only or the
      # browser drops it.
      GATEWAY_SESSION_COOKIE_SECURE: "false"
      GATEWAY_LOG_JSON: "false"
    depends_on:
      keycloak:
        condition: service_healthy
