# A Keycloak to develop against. Not a bundled identity provider.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml \
#     -f deploy/compose/docker-compose.proxy.yml \
#     -f deploy/compose/docker-compose.keycloak.yml up -d
#
#   ./deploy/keycloak/setup.sh        # realm, clients, mappers, a test user
#
# ## This does not reverse ADR 0044
#
# ADR 0044 removed Keycloak from the stack, and that stays removed. What it
# actually decided was that the *deployment* ships no identity provider and
# configures OIDC against whatever issuer deploy/.env names. This file is a
# development dependency in a separate overlay: nothing in the base compose
# references it, `GATEWAY_OIDC__*` still points at a URL rather than at a
# service, and pointing it at a real corporate directory instead needs no
# change here. It exists because the OIDC paths — bearer tokens on `/v1`
# (ADR 0040), account linking (ADR 0056), group sync (ADR 0057) — had unit
# tests and a stub, and more than half the serious bugs in this project were
# only findable against a running stack.
#
# ## Against the fourth ground rule: nothing new is published
#
# There are deliberately **no `ports:`** here. Keycloak listens on the compose
# network only and reaches a browser through Caddy, on the origin that is
# already published. The .103 host's firewall permits 8443 and 22 and nothing
# else, so a second published port would not have worked anyway — but the rule
# is the reason, not the firewall.
#
# ## One origin, and why the path prefix is not a hack
#
# deploy/caddy/Caddyfile argues that the IdP belongs on its own host, because
# the gateway owns `/auth/callback`, an IdP owns its own paths, and those
# collide at the root. They collide at the *root*. Under a prefix they do not:
# the gateway keeps `/`, Keycloak gets `/idp`, and the session cookie stays
# trivially same-origin because there is still one origin. That is the premise
# the Caddyfile's comment leaves open rather than a contradiction of it.
#
# The prefix is done in the two halves that Keycloak 26 actually wants, which
# is the part that took reading the documentation rather than guessing:
#
#   KC_HOSTNAME carries the path (`.../idp`) and is what builds every URL
#   Keycloak *advertises* — the issuer, the discovery document, the redirects.
#   The documentation is explicit that this takes precedence for URL
#   construction, and that `KC_HTTP_RELATIVE_PATH` should **not** also be set
#   for this case, which is why it is absent below.
#
#   Caddy's `handle_path` strips `/idp` before proxying, so Keycloak keeps
#   *serving* at the root it thinks it is at. Prefix applied once, in the
#   layer that owns the routing.
#
# ## The gateway has to verify Caddy's certificate to reach the issuer
#
# `OIDCSettings` has an `issuer` and no separate discovery URL — discovery is
# derived from the issuer, correctly, since an issuer whose discovery document
# lives somewhere else is not a fact worth modelling. So the gateway fetches
# `https://$PUBLIC_HOST:$HTTPS_PORT/idp/realms/...` over the public origin,
# where `tls internal` means a CA nothing has heard of.
#
# Two things follow, both measured on this host rather than assumed:
# the container *can* reach the public address (hairpin NAT works here — a TCP
# connect from inside the gateway to 130.192.84.103:8443 succeeds), and
# `SSL_CERT_FILE` is enough to make httpx verify Caddy's root, which was the
# open question. Without it the fetch fails
# `CERTIFICATE_VERIFY_FAILED: unable to get local issuer certificate`.
#
# The alternative — an internal issuer URL over plain http — was rejected: the
# browser cannot resolve `keycloak:8080`, and making Keycloak advertise
# different URLs per requester (`hostname-backchannel-dynamic`) means `iss`
# depends on who asked, which is exactly the claim that must not be ambiguous.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    # `start-dev` rather than `start`: this is a development identity provider,
    # and saying so in the command is better than a production-shaped
    # invocation that happens to be pointed at an H2 file. It also skips the
    # hostname-strict and TLS requirements that `start` enforces — which we
    # satisfy anyway via KC_HOSTNAME below, so the only thing dev mode buys is
    # not having to provision a Postgres database for a throwaway realm.
    command: ["start-dev"]
    environment:
      # KC 26 renamed these from KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD. They
      # bootstrap the master-realm admin, used by setup.sh and the admin UI at
      # $PUBLIC_ORIGIN/idp/admin/.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in deploy/.env}
      # The external URL, path included. Everything Keycloak advertises is
      # built from this, so `iss` is this plus /realms/<realm> — the one value
      # the gateway and the browser both have to agree on.
      KC_HOSTNAME: ${PUBLIC_ORIGIN}/idp
      # Caddy terminates TLS and the hop to here is inside the compose network.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      # H2 lives in data/h2, so a named volume here persists the realm, its
      # clients and their generated secrets across restarts. The realm is built
      # by deploy/keycloak/setup.sh rather than imported from a JSON: the
      # redirect URIs and the issuer are all built from $PUBLIC_ORIGIN, and a
      # committed realm file cannot interpolate that. The script is idempotent,
      # so it is the source of truth and re-running it is the way to change the
      # realm.
      #
      # The other reason is that client secrets are generated here and read out
      # by that script. A realm JSON with secrets in it would be a credential
      # committed to the repository, for an IdP that *is* reachable on the
      # published origin.
      #
      # Mounted at `data`, not `data/h2`, and that distinction cost a debugging
      # round. Docker copies the ownership of the image's directory onto a
      # fresh named volume only when that directory **exists in the image**.
      # `/opt/keycloak/data` does, as `keycloak:root` 775; `/opt/keycloak/data/h2`
      # does not — Keycloak creates it at runtime — so a volume mounted there
      # arrives `root:root` 755, and the container's uid 1000 cannot write it.
      # The symptom is an H2 stack trace ending in `TraceSystem.openWriter`,
      # which names the tracing subsystem rather than the permission.
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # KC 26 serves health on the management port (9000), not the HTTP port,
      # and the image has no curl — hence Java's own client.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Caddy gains the /idp route, and the gateway gains the trust it needs to
  # fetch the issuer. Both are additive: without this overlay the conf.d glob
  # matches only the empty placeholder and the gateway has no SSL_CERT_FILE.
  proxy:
    volumes:
      - ../caddy/conf.d-idp/10-idp.caddy:/etc/caddy/conf.d/10-idp.caddy:ro

  # Seeds the trust bundle the gateway reads, and exits.
  #
  # Two failures found bringing this overlay up, both recorded because neither
  # symptom names its cause.
  #
  # **A missing file is fatal, not ignored.** `SSL_CERT_FILE` pointing at a
  # path that does not exist does not fall back to the system store: httpx
  # calls `ssl.create_default_context(cafile=os.environ["SSL_CERT_FILE"])`,
  # which raises `FileNotFoundError`, and the gateway dies in startup with a
  # trace about TLS configuration and no mention of the path. So the file has
  # to exist before the gateway's first start, which is what this service is
  # for.
  #
  # **It cannot be Caddy's root at that point.** The obvious version of this
  # copied the local authority out of caddy-data and made the gateway depend on
  # it — which compose rejects outright: `caddy-ca -> proxy -> gateway ->
  # caddy-ca`. The proxy waits for the gateway to be healthy, so Caddy's CA
  # provably does not exist yet on a first run.
  #
  # The way out is that the gateway does not *need* Caddy's root on that first
  # start: OIDC is off until an operator sets `GATEWAY_OIDC__*`, and the
  # gateway reads OIDC discovery once at startup, so **enabling OIDC already
  # requires a restart** (ADR 0044). deploy/keycloak/setup.sh appends Caddy's
  # root to this same file, and the restart that was always necessary is the
  # one that picks it up. No new ordering rule for anyone to remember.
  ca-bundle:
    image: caddy:2.11-alpine
    volumes:
      - ../tls:/out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -s /out/caddy-root.crt ]; then
          echo "bundle exists: $$(grep -c 'BEGIN CERTIFICATE' /out/caddy-root.crt) certificates"
          exit 0
        fi
        # The public roots, and only those, for now. Note what this file is
        # *not*: Caddy's root alone. SSL_CERT_FILE replaces the trust store
        # rather than adding to it, so a bundle holding only the local
        # authority would leave the gateway unable to verify any real
        # provider. Nothing would show on this stack, where the upstream is
        # the fake one over http — it would show the first time the deployment
        # called Cortecs or Anthropic.
        cp /etc/ssl/certs/ca-certificates.crt /out/caddy-root.crt
        echo "seeded with $$(grep -c 'BEGIN CERTIFICATE' /out/caddy-root.crt) public roots"
        echo "run deploy/keycloak/setup.sh to append Caddy's local authority"
    restart: "no"

  gateway:
    depends_on:
      ca-bundle:
        condition: service_completed_successfully
    environment:
      # Verifying Caddy's internal CA rather than skipping verification: the
      # gateway has to fetch the issuer over the public https origin, and
      # `tls internal` means a CA nothing has heard of. Measured on this host —
      # without this, `CERTIFICATE_VERIFY_FAILED: unable to get local issuer
      # certificate`; with it, the handshake verifies.
      SSL_CERT_FILE: /etc/ssl/caddy/caddy-root.crt
    volumes:
      # The *directory*, not the file. A bind mount of a path that does not yet
      # exist makes Docker create a **directory** there, and the CA is written
      # by setup.sh after the stack is already up — so mounting the file
      # directly turns a first run into `caddy-root.crt/` and an error that
      # blames TLS rather than the mount.
      - ../tls:/etc/ssl/caddy:ro

volumes:
  keycloak-data:
