# Puts a TLS reverse proxy in front of the stack and serves it on a real
# address, in either of the two configurations described in
# deploy/caddy/Caddyfile: an IP with a self-signed certificate, or an FQDN with
# Let's Encrypt.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml \
#     -f deploy/compose/docker-compose.proxy.yml up -d --build
#
#   ./scripts/test_public_tls_live.py     # checks what this file claims
#
# ## Against the fourth ground rule
#
# CLAUDE.md says the dev stack never goes on a routable address. That rule is not
# a superstition about routable addresses; it is a list of three specific holes —
# plaintext HTTP, a session cookie without `Secure`, and a management password
# that is either in the repository or guessed. This file closes all three rather
# than arguing with it, and ADR 0035 records the decision and what is still true
# afterwards.
#
#   plaintext            → Caddy terminates TLS. The plaintext hop is inside the
#                          compose network; nothing published is http.
#   non-Secure cookie    → GATEWAY_SESSION_COOKIE_SECURE=true, which is only
#                          safe to set *because* of the first line.
#   published passwords  → the only management credential this shape seeds is
#                          the local admin's (ADR 0043), and its password comes
#                          from deploy/.env, which is not in the repository.
#
# ## PUBLIC_BIND is not the public address
#
# On a NAT-ed cloud instance the address a browser types is not an address the
# host has: `ip -brief addr` on the LINKS development host shows 10.50.2.183 and
# nothing else, while the world reaches it at 130.192.84.103. Docker cannot
# publish on an address the host does not hold, so what gets *bound*
# (PUBLIC_BIND, every interface by default) and what gets *typed* (PUBLIC_HOST,
# which the certificate, the Caddyfile and every OIDC URL are built from) are
# separate variables. Binding here is deliberately every interface by default:
# the certificate and the public URL come from PUBLIC_HOST, while Docker can
# only publish on an address the host actually holds.
#
# ## OIDC is whatever deploy/.env says (docs/oidc-generic-provider.md)
#
# By default there is no bundled identity provider: when GATEWAY_OIDC__ENABLED
# is true the gateway talks to whichever issuer deploy/.env names — GitLab,
# Entra ID, Keycloak elsewhere, anything speaking OpenID Connect discovery —
# and every setting passes through unchanged, because the differences between
# providers live in those settings (issuer, claim names, an audience) rather
# than in anything this file could know. Leave it unset and the console's
# password form is the only way in. The installer can instead deploy a bundled
# provider (Authelia or Keycloak) alongside the gateway via the matching
# docker-compose.idp-*.yml overlay, which routes its prefix through this
# file's conf.d import; the OIDC variables below then name the bundled issuer.

services:
  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      # 80 is only useful in the Let's Encrypt configuration, where the HTTP-01
      # challenge arrives on it. Published in both, because a browser sent to a
      # bare address tries it first, and a connection refused is a worse answer
      # than a redirect.
      - "${PUBLIC_BIND:-0.0.0.0}:80:80"
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    environment:
      # What a browser types, and the single source for every URL this
      # deployment advertises. Defaults to host and port; set it explicitly to
      # drop a default port from those URLs (see deploy/.env.example).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}:${HTTPS_PORT:-443}}
      # The host on its own. Caddy needs it separately for default_sni, which
      # the Caddyfile explains.
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}
      # "tls internal" for a self-signed certificate from Caddy's own CA; empty
      # for automatic Let's Encrypt, which needs an FQDN and ports 80 and 443
      # reachable from the internet.
      TLS_DIRECTIVE: ${TLS_DIRECTIVE-tls internal}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.org}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Not optional. This holds the issued certificates *and* the internal CA's
      # key: losing it in the Let's Encrypt configuration means re-issuing on
      # every restart, which is how a deployment meets the rate limit; losing it
      # in the self-signed one means a new CA, and every browser that accepted
      # the old certificate warns again.
      - caddy-data:/data
      - caddy-config:/config
    # No depends_on on the gateway, deliberately. The old service_healthy
    # edge is what forced --no-deps on every gateway-less deployment: `up
    # proxy` drags its whole dependency closure in, and a gateway that is
    # *defined* (the base file always defines it) is dragged even by a
    # required:false edge. Caddy needs no ordering guarantee — an upstream
    # that is not up yet answers 502 and recovers on the next request — and
    # the installers already wait for the gateway (and, under the bundled
    # IdPs, run the CA dance) before anything configures itself against the
    # origin. Removing the edge is what lets `up -d proxy` and `up -d chat
    # proxy` mean exactly the named set on a box that holds no gateway.
    healthcheck:
      # Proves the process is up and holding a config. Caddy's admin API is on
      # loopback inside the container and is not published.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    environment:
      # Which peers may be believed about X-Forwarded-Proto. uvicorn trusts
      # 127.0.0.1 only, and the proxy reaches the gateway from the compose
      # network, so out of the box every forwarded header from it is discarded
      # and the app believes the request arrived over http. Nothing 500s: the
      # /v1 surfaces never build a URL, and the one place that reads
      # request.base_url — the post-logout landing URL, when an identity
      # provider is configured — then goes to the IdP as http://, does not match
      # the https URI registered there, and comes back 400 after a login that
      # worked perfectly. Docker's own bridge range, so it covers whichever
      # subnet compose allocated, plus the published loopback port the live
      # scripts use.
      FORWARDED_ALLOW_IPS: "172.16.0.0/12,127.0.0.1"
      # Only safe to turn on because TLS is terminated in front. On plain http a
      # `Secure` cookie is set by the server and never sent back, and the symptom
      # is a login that appears to succeed and lands on a signed-out console.
      GATEWAY_SESSION_COOKIE_SECURE: "true"
      # Local email + password sign-in (ADR 0043). Behind this proxy the origin
      # is TLS and the password comes from deploy/.env, which is the shape the
      # feature assumes; on the loopback-only dev shape it stays off. The
      # account itself is created out-of-band: `docker compose ... exec gateway
      # gateway passwd <email>` — the bootstrap needs no running session.
      GATEWAY_LOCAL_AUTH__ENABLED: ${GATEWAY_LOCAL_AUTH__ENABLED:-true}
      # OIDC against any provider, configured entirely from deploy/.env — see
      # docs/oidc-generic-provider.md. Off until an issuer is named and enabled.
      GATEWAY_OIDC__ENABLED: ${GATEWAY_OIDC__ENABLED:-false}
      GATEWAY_OIDC__ISSUER: ${GATEWAY_OIDC__ISSUER:-}
      GATEWAY_OIDC__CLIENT_ID: ${GATEWAY_OIDC__CLIENT_ID:-}
      GATEWAY_OIDC__CLIENT_SECRET: ${GATEWAY_OIDC__CLIENT_SECRET:-}
      GATEWAY_OIDC__REDIRECT_URI: ${GATEWAY_OIDC__REDIRECT_URI:-${PUBLIC_ORIGIN:-https://${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}:${HTTPS_PORT:-443}}/auth/callback}
      GATEWAY_OIDC__GROUPS_CLAIM: ${GATEWAY_OIDC__GROUPS_CLAIM:-groups}
      GATEWAY_OIDC__ADMIN_GROUPS: ${GATEWAY_OIDC__ADMIN_GROUPS:-[]}
      GATEWAY_OIDC__ACCESS_TOKEN_AUDIENCE: ${GATEWAY_OIDC__ACCESS_TOKEN_AUDIENCE:-}

volumes:
  caddy-data:
  caddy-config:
