# The paseo-relay: the rendezvous that lets the chat server reach coding-agent
# daemons on machines nobody can dial (ADR 0085). The daemon on the person's
# own machine dials *out* to this relay and stays connected; Cerea connects to
# the same relay as an E2EE client and is routed to the right daemon by its
# `serverId`. The relay is identity-blind — it bridges WebSocket sessions and
# never sees a token, a password, or plaintext content — so it needs no secrets
# and no database.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.proxy.yml \
#     -f deploy/compose/docker-compose.chat.yml \
#     -f deploy/compose/docker-compose.code-relay.yml \
#     --profile chat --profile code-relay up -d --build
#
# Or the installer asks, and writes CODE_AGENTS_ENABLED=true plus
# CODE_RELAY_URL=relay:4000 alongside selecting this overlay.
#
# ## The image is *built from source*, on purpose — and the source arrives the
# same way the relay container in the ADR 0085 PoC got it: a git clone pinned
# to one commit, `deploy/code-relay/paseo-relay/`, fetched at install time by
# `deploy/code-relay/fetch.sh` (re-running it fetches nothing when the commit
# is already checked out). There is no published relay image (verified when
# ADR 0085 was written) and the project warns its internal protocol may change
# without notice, so a pinned source build is also how the churn risk is
# managed: re-verify on upgrade, never float.
#
# ## Why a subpath, not a port
#
# The relay must be reachable from *outside* the compose network — the whole
# point is that daemons on people's laptops (behind NAT, no VPN) dial it —
# but nothing here publishes a port for it. It rides the origin already
# published, at the /ws subpath (deploy/caddy/conf.d-code-relay/20-relay.caddy
# under the proxy overlay; an installer-appended block under the edge shape,
# same as the bundled IdP routes). Cerea reaches the same relay at relay:4000
# over the compose network; the daemons reach it at <PUBLIC_ORIGIN>/ws from
# wherever they are, and the pairing offer the user pastes into the panel
# records that public endpoint. The traffic itself is E2E-encrypted between
# Cerea and the daemon (Curve25519/NaCl); the relay terminates only the
# WebSocket, never the content.

services:
  relay:
    # `profiles: [code-relay]` — the relay runs only where the /code panel is
    # enabled, and including this file without the profile deploys nothing.
    # No `ports:` — the fourth ground rule holds for the relay too: outside
    # reaches it through Caddy at <origin>/ws (the snippet below); compose
    # peers use ws://relay:4000 directly.
    profiles: [code-relay]
    build:
      context: ../code-relay/paseo-relay
    restart: unless-stopped
    environment:
      PASEO_RELAY_HOST: "0.0.0.0"
      PASEO_RELAY_PORT: "4000"
    healthcheck:
      # The relay image ships no wget or curl, and /dev/tcp is a bash-ism:
      # CMD-SHELL runs /bin/sh (dash), where /dev/tcp does not exist and
      # the probe dies with "Directory nonexistent" (found live). Bash is
      # present at /usr/bin/bash, so the probe says bash explicitly.
      # Liveness only — /ready also reports drain state, which would
      # restart a draining relay.
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/4000 && printf 'GET /health HTTP/1.0\\\\r\\\\n\\\\r\\\\n' >&3 && cat <&3 | grep -q '200 OK'\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Caddy gains the /ws route. Additive: without this overlay the conf.d
  # glob matches only the committed placeholder and nothing else routes
  # there, so a deployment without it is byte-for-byte unchanged.
  proxy:
    volumes:
      - ../caddy/conf.d-code-relay/20-relay.caddy:/etc/caddy/conf.d/20-relay.caddy:ro
