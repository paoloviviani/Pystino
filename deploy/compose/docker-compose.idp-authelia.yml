# The bundled Authelia: the installer deploys this alongside the gateway as
# the deployment's own OIDC provider, so an enterprise install needs no
# external directory.
#
#   ./installer/install.sh   # choose the bundled Authelia in the sign-in menu
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.proxy.yml \
#     -f deploy/compose/docker-compose.idp-authelia.yml up -d --build
#
# ## What the installer generates, and this file consumes
#
# `deploy/idp/` holds three generated files (never committed, never edited by
# hand — the installer writes them with `deploy/idp/generate-authelia-config.sh`,
# minting every secret locally):
#
#   deploy/idp/authelia-configuration.yml  the IdP: file user backend, OIDC
#                                          provider (clients pystino-console
#                                          + cerea + opencode-enrollment,
#                                          audience pystino-api),
#                                          served under the /authelia prefix
#   deploy/idp/users_database.yml          the first human
#   deploy/idp/authelia-jwks-rsa.pem       the OIDC signing key backup
#                                          (chmod 600; embedded in the yml)
#
# The audience is the deterministic part: `pystino-api`, granted to both
# clients implicitly, so the installer writes
# GATEWAY_OIDC__ACCESS_TOKEN_AUDIENCE=pystino-api with no prompting and no
# IdP API call. The issuer is <PUBLIC_ORIGIN>/authelia.
#
# ## One origin, and why the prefix is served rather than stripped
#
# Same premise as the Keycloak overlays (the gateway owns `/auth/callback`,
# an IdP owns its own paths, they collide at the root, under a prefix they
# do not) with the halves reversed to what Authelia wants:
#
#   Authelia's `server.address` carries the path (`tcp://:9091/authelia`), so
#   Authelia *serves* under /authelia and *advertises* every URL — issuer,
#   discovery, endpoints — with the prefix. Caddy's `handle` (in the snippet
#   below) therefore forwards WITHOUT stripping, the opposite of Keycloak's
#   `handle_path`. Stripping the prefix hands Authelia paths it does not
#   serve (its portal assets 404, and the failure names the asset, not the
#   routing) — the prefix is applied once, in Authelia's own config.
#
# ## The gateway has to verify Caddy's certificate to reach the issuer
#
# `OIDCSettings` has an `issuer` and no separate discovery URL — discovery is
# derived from the issuer, correctly, since an issuer whose discovery document
# lives somewhere else is not a fact worth modelling. So the gateway fetches
# `https://$PUBLIC_HOST:$HTTPS_PORT/authelia/.well-known/openid-configuration`
# over the public origin, where `tls internal` means a CA nothing has heard
# of. The `ca-bundle` service and `SSL_CERT_FILE` below are the arrangement
# the Keycloak overlays measured: without the bundle the fetch fails
# `CERTIFICATE_VERIFY_FAILED`; with it, the handshake verifies. The bundle is
# seeded with the public roots first (SSL_CERT_FILE *replaces* the trust
# store), and the installer appends Caddy's local authority after the
# proxy's first run — the OIDC restart that is always necessary (discovery
# is read once at startup) is the one that picks it up.
#
# ## Edge exposure
#
# `Caddyfile.netbird` has no `conf.d` import, so this overlay's snippet only
# routes under the proxy overlay. Behind the edge shape the installer appends
# the equivalent `handle /authelia/*` block (no stripping, same reason) to
# both sites in that file — see the report/proposal, not this overlay.
#
# ## What this overlay deliberately does not set
#
# No `GATEWAY_OIDC__*` connection values: those live in deploy/.env, written
# by the installer from the generation spec (issuer <origin>/authelia,
# client pystino-console, audience pystino-api). The two lines under the
# gateway are the trust and audience plumbing the base file cannot carry on
# its own: the audience variable the base file does not interpolate, and the
# trust bundle the issuer fetch needs. Never set GATEWAY_OIDC__ADMIN_GROUPS
# (removed, ADR 0069 — the gateway refuses to start with it).
#
# ## The profile: `authelia`
#
# `authelia` and `ca-bundle` carry `profiles: [authelia]`: the bundled IdP is
# selected by `--profile authelia` (or `COMPOSE_PROFILES`, which compose also
# reads from `--env-file`), not only by including this file. The file's other
# half — the proxy's /authelia route, the gateway's trust and audience
# plumbing — sits on services that run in every shape and applies whenever the
# file is included, profile or not. Naming `authelia` explicitly still starts
# it (compose activates a targeted service's own profile), so a service list
# like the phase-1 `up ... authelia ca-bundle proxy` needs no change. And a
# set that includes this file without the profile removes nothing: services
# outside the active model are orphans compose leaves running, so the
# pre-profile command lines keep an existing stack alive — they only stop
# managing it until `--profile authelia` joins the line.

services:
  authelia:
    # Pinned: Authelia makes no stability promise on `latest`, and the OIDC
    # provider is still officially beta — an unpinned pull is a behaviour
    # change on restart. Apache-2.0, a static Go binary (~25 MB); it downloads
    # nothing at runtime (file backend, sqlite, filesystem notifier).
    #
    # `profiles: [authelia]` — selected with its one-shot bundler by
    # --profile authelia (see the header); the name is the installer's
    # IDP_BUNDLED value, so the flag can be passed straight through.
    profiles: [authelia]
    # At least 4.39.22: the opencode-enrollment public client uses the device
    # authorization grant (RFC 8628), which Authelia introduced in 4.39.0 but
    # only made reliable with the device-grant bugfixes in later 4.39.x. Do
    # not move this pin below 4.39.22 while that client exists.
    image: authelia/authelia:4.39.22
    restart: unless-stopped
    # No `ports:` — the fourth ground rule. A browser reaches Authelia through
    # Caddy at <origin>/authelia (the snippet below); compose peers use
    # http://authelia:9091/authelia directly.
    environment:
      # The image healthcheck spiders ${PATH}/api/health; the path prefix is
      # where this deployment serves, so without this the healthcheck probes
      # a path Authelia does not answer and the container never goes healthy.
      X_AUTHELIA_HEALTHCHECK_PATH: /authelia
    volumes:
      - ../idp/authelia-configuration.yml:/config/configuration.yml:ro
      - ../idp/users_database.yml:/config/users_database.yml:ro
      # sqlite + the filesystem notifier live here: opaque subject ids and
      # consent grants. No second Postgres, no role for the installer to
      # create in phase 1, no coupling to the gateway's database.
      - authelia-data:/data
    healthcheck:
      # The image's own script (wget against /api/health under the prefix
      # above); overridden only to fail faster than its 30s interval while
      # the stack is coming up.
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # Caddy gains the /authelia route. Additive: without this overlay the
  # conf.d glob matches only the committed placeholder and nothing else
  # routes there, so a deployment without it is byte-for-byte unchanged.
  proxy:
    volumes:
      - ../caddy/conf.d-authelia/20-authelia.caddy:/etc/caddy/conf.d/20-authelia.caddy:ro

  # Seeds the trust bundle the gateway reads, and exits. Same two failures
  # the Keycloak overlay recorded, same answers: a missing file is fatal
  # (SSL_CERT_FILE replaces the store, it never falls back), and it cannot
  # be Caddy's root yet (compose would reject the caddy-ca -> proxy ->
  # gateway -> caddy-ca cycle) — so public roots now, Caddy's authority
  # appended by the installer step, picked up by the restart OIDC needs
  # anyway.
  #
  # `profiles: [authelia]` — same profile as the IdP it serves: in a set
  # where Authelia will not run, seeding the trust bundle is a one-shot
  # container nobody needs. This is also why the gateway's depends_on below
  # is `required: false`: with the profile inactive the bundler is out of
  # the model, and a required dependency on it would make the whole set an
  # invalid compose project instead of merely bundle-less.
  ca-bundle:
    profiles: [authelia]
    image: caddy:2.11-alpine
    volumes:
      - ../tls:/out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -s /out/caddy-root.crt ]; then
          echo "bundle exists: $$(grep -c 'BEGIN CERTIFICATE' /out/caddy-root.crt) certificates"
          exit 0
        fi
        cp /etc/ssl/certs/ca-certificates.crt /out/caddy-root.crt
        echo "seeded with $$(grep -c 'BEGIN CERTIFICATE' /out/caddy-root.crt) public roots"
        echo "installer appends Caddy's local authority, then restarts the gateway"
    restart: "no"

  gateway:
    depends_on:
      # required:false because ca-bundle carries the authelia profile (see
      # its comment): with the profile inactive the bundler is out of the
      # model and a required dependency would refuse the whole set. When the
      # profile is active the ordering holds exactly as before.
      ca-bundle:
        condition: service_completed_successfully
        required: false
    environment:
      # Verifying Caddy's internal CA rather than skipping verification (see
      # above). The directory, not the file (same mount-shape lesson as the
      # Keycloak overlay): a bind mount of a path that does not yet exist
      # makes Docker create a directory there, and this file is written after
      # the stack is already up.
      SSL_CERT_FILE: /etc/ssl/caddy/caddy-root.crt
      # The base file does not interpolate this variable; the proxy overlay
      # does, but only under that exposure. Stated here so the audience the
      # installer writes reaches the gateway on every shape. Empty means API
      # keys only — the deployment-wide /v1 opt-in (ADR 0040).
      GATEWAY_OIDC__ACCESS_TOKEN_AUDIENCE: ${GATEWAY_OIDC__ACCESS_TOKEN_AUDIENCE:-}
    volumes:
      - ../tls:/etc/ssl/caddy:ro

volumes:
  authelia-data:
