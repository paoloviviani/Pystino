# The chat application, on the origin already published.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml \
#     -f deploy/compose/docker-compose.proxy.yml \
#     -f deploy/compose/docker-compose.keycloak.yml \
#     -f deploy/compose/docker-compose.chat.yml up -d
#
# ## It is a client, and this file is the proof
#
# `pystino-chat` imports nothing from the gateway: it is built from its own
# repository, talks over `/v1`, and authenticates with an OIDC access token.
# Nothing below mounts gateway source, shares its database, or reads its
# environment — the only thing it is told is a URL and a client secret.
#
# ## Nothing new is published (the fourth ground rule)
#
# No `ports:`. A browser reaches it through Caddy at `/chat` on the origin that
# is already there — the same arrangement Keycloak gets at `/idp`, and for the
# same reason: the .103 host permits 8443 and 22, and one origin keeps the
# session cookie same-origin.
#
# `CHAT_PORT` in deploy/.env is *not* a published port and this file does not
# use it. `test_public_tls_live.py` asserts nothing answers there, and that
# assertion is meant to keep passing.
#
# ## Why the base path is set twice
#
# `APP_BASE=/chat` is a **build-time** value: SvelteKit bakes `paths.base` into
# the bundle, so it is an argument to `docker build` and not an environment
# variable at run time. Setting it only in `environment:` builds an application
# rooted at `/` whose every asset 404s behind the prefix. Caddy's `handle_path`
# strips the prefix, so the server sees `/` and the browser sees `/chat`.
#
# ## Its credential, and the one place a shared key remains
#
# `USE_USER_TOKEN=true` makes every inference call carry the signed-in person's
# own access token, so the gateway bills that person's group (ADR 0040) and
# `x-bill-to` can choose which one (ADR 0061).
#
# `OPENAI_API_KEY` is still needed and is **not** used for inference. chat-ui
# builds its model catalogue once at boot, before anyone has signed in, by
# fetching `${OPENAI_BASE_URL}/models` — a request with no user to attribute.
# Two consequences to know: the catalogue is whatever *that* key's user may
# reach, so it should be a key whose user sees every model the deployment
# offers; and because listing models bills nothing, the key spends nothing.
# Making the catalogue per-user needs an upstream change — the model list is a
# module-level singleton — and is not attempted here.

services:
  chat-mongo:
    # chat-ui stores conversations, users, settings and files in MongoDB. It is
    # the application's own store and nothing else reads it; the gateway's
    # PostgreSQL is untouched, which is the boundary this deployment exists to
    # keep.
    image: mongo:8
    restart: unless-stopped
    volumes:
      - chat-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  chat:
    build:
      # An absolute path, required rather than defaulted. A relative default
      # resolves against this file's directory, which is right for a plain
      # checkout and wrong from a git worktree — `deploy/compose/../../..` is
      # two levels off there, and the error names a path nobody wrote:
      # "path /home/.../.claude/worktrees/pystino-chat not found". The chat is
      # a sibling repository at whatever address the operator cloned it to, so
      # asking is more honest than guessing.
      context: ${CHAT_REPO:?set CHAT_REPO in deploy/.env to the pystino-chat checkout}
      dockerfile: Dockerfile
      args:
        # Build-time, for the reason in the header comment.
        APP_BASE: /chat
        PUBLIC_APP_NAME: ${CHAT_APP_NAME:-Pystino Chat}
    restart: unless-stopped
    depends_on:
      chat-mongo:
        condition: service_healthy
    environment:
      # Configuration arrives as one blob, not as individual variables, because
      # the image's entrypoint runs `dotenv -e /app/.env -c -- node server.js`.
      # `/app/.env` is chat-ui's committed defaults — `OPENAI_BASE_URL=` empty,
      # `USE_USER_TOKEN=false` — and passing settings through `environment:`
      # puts them in a race with that file. `DOTENV_LOCAL` is the mechanism the
      # entrypoint provides for exactly this: it writes `.env.local`, which
      # overrides `.env`.
      #
      # SvelteKit's node adapter trusts `x-forwarded-*` only when told to, and
      # Caddy is what terminates TLS. Without the three `*_HEADER` lines the
      # redirect it builds is `http`, and an https-registered OIDC client
      # refuses it *after* a login that appeared to work — the same trap
      # ADR 0035 records for the gateway, in a second codebase.
      DOTENV_LOCAL: |
        MONGODB_URL=mongodb://chat-mongo:27017
        MONGODB_DB_NAME=chat-ui

        # The gateway, inside the compose network. Deliberately not the public
        # origin: a server-to-server hop that never leaves the host needs no
        # TLS and no certificate to verify, and the browser never sees this URL.
        OPENAI_BASE_URL=http://gateway:8000/v1
        OPENAI_API_KEY=${CHAT_CATALOGUE_KEY:?mint a gwk_ key and set CHAT_CATALOGUE_KEY in deploy/.env}

        # Every inference call carries the signed-in person's own access token,
        # so the gateway bills that person (ADR 0040).
        USE_USER_TOKEN=true
        # No anonymous mode: the gateway has nothing to bill a caller it cannot
        # identify, so a visitor who is not signed in would only see an error.
        AUTOMATIC_LOGIN=true

        OPENID_CONFIG=${CHAT_OPENID_CONFIG:?run deploy/keycloak/setup.sh and copy its OPENID_CONFIG line into deploy/.env as CHAT_OPENID_CONFIG}

        # Encrypts MCP connector credentials at rest (ADR 0064) — OAuth tokens
        # and static API tokens, which used to live in browser localStorage.
        # Required rather than defaulted: a default would mean every deployment
        # that forgot shared a key, which is indistinguishable from no
        # encryption while looking like encryption.
        CHAT_SECRET_KEY=${CHAT_SECRET_KEY:?generate a long random value and set CHAT_SECRET_KEY in deploy/.env}

        PUBLIC_APP_NAME=${CHAT_APP_NAME:-Pystino Chat}
        PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
        ORIGIN=${PUBLIC_ORIGIN}/chat
        ADDRESS_HEADER=X-Forwarded-For
        PROTOCOL_HEADER=X-Forwarded-Proto
        HOST_HEADER=X-Forwarded-Host

      # Node has to verify Caddy's internal CA, for the same reason the gateway
      # does: OIDC discovery is fetched from the issuer, which is the public
      # https origin, and `tls internal` means a CA nothing has heard of. The
      # symptom without it is a 500 on the first page load whose only detail is
      # `UNABLE_TO_GET_ISSUER_CERT_LOCALLY` — a TLS error that names no host,
      # in a request the browser made to the chat rather than to Keycloak.
      #
      # `NODE_EXTRA_CA_CERTS` *adds* to the trust store rather than replacing
      # it, which is the opposite of Python's `SSL_CERT_FILE` — so this one may
      # safely point at a bundle that also holds the public roots, and the file
      # ca-bundle already builds is exactly that.
      NODE_EXTRA_CA_CERTS: /etc/ssl/caddy/caddy-root.crt
    volumes:
      # The directory, not the file — see docker-compose.keycloak.yml for why a
      # bind mount of a not-yet-existing file becomes a directory.
      - ../tls:/etc/ssl/caddy:ro

  proxy:
    volumes:
      - ../caddy/conf.d-chat/20-chat.caddy:/etc/caddy/conf.d/20-chat.caddy:ro

volumes:
  chat-mongo-data:
