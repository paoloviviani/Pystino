# The chat application, on the origin already published.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml \
#     -f deploy/compose/docker-compose.chat.yml \
#     -f deploy/compose/docker-compose.proxy.yml \
#     --profile chat up -d
#
# (An exposure overlay — proxy or edge — is not optional in that line: the
# chat publishes no port and depends on the proxy, so a loopback set is
# refused by compose rather than deployed half-working. The header here used
# to show the line without one; it never parsed.)
#
# ## It is a client, and this file is the proof
#
# `pystino-chat` imports nothing from the gateway: it is built from its own
# repository, talks over `/v1`, and authenticates with an OIDC access token.
# Nothing below mounts gateway source, shares its database, or reads its
# environment — the only things it is told are URLs and a client credential.
#
# ## Where it signs in (ADR 0068)
#
# Against the gateway's own IdP: `OPENID_PROVIDER_URL` is the deployment's
# public origin, which is the issuer the gateway is configured with. The chat
# backend fetches discovery once from that URL — so the edge's certificate for
# the public name must be one Node trusts without help, which a publicly
# resolvable name already implies — and then follows discovery everywhere
# else: the token endpoint, JWKS and userinfo are advertised at the gateway's
# *internal* address, so the exchanges and the key fetches never leave the
# compose network and never meet the edge at all. Only the browser's
# `/oauth/authorize` round trip is public, which is inherent to the flow.
#
# ## Nothing new is published (the fourth ground rule)
#
# No `ports:`. A browser reaches it through the origin's reverse proxy at
# `/chat` — one origin keeps the session cookie same-origin.
#
# ## Why the base path is set twice
#
# `APP_BASE=/chat` is a **build-time** value: SvelteKit bakes `paths.base` into
# the bundle, so it is an argument to `docker build` and not an environment
# variable at run time. Setting it only in `environment:` builds an application
# rooted at `/` whose every asset 404s behind the prefix.
#
# ## Its credential, and why none is minted for the boot fetch
#
# `USE_USER_TOKEN=true` makes every inference call carry the signed-in person's
# own access token, so the gateway bills that person's group (ADR 0040) and
# `x-bill-to` can choose which one (ADR 0061).
#
# `OPENAI_API_KEY` is unset on purpose. chat-ui builds its model catalogue once
# at boot, before anyone has signed in, by fetching `${OPENAI_BASE_URL}/models`
# — a request with no user to attribute, which is exactly why a key here used
# to have to be a *deployment-wide, spend-capable* credential minted just to
# read a list. `GET /v1/models` now answers that fetch without authentication
# (ADR 0081): the full catalogue, brochure-level fields only — no prices, no
# grants, nothing a caller could not already infer from the console being
# public marketing. Nothing gets more reachable for it: the per-caller list at
# `GET /api/v2/models` still intersects this boot catalogue with the signed-in
# person's own token, and the gateway still checks a real grant on every
# `/v1/chat/completions` call regardless of what the list showed. Pystino no
# longer mints anything for this container to boot with.
#
# ## The profile: `chat`
#
# Both services below carry `profiles: [chat]`: a set selects them by passing
# `--profile chat` (or `COMPOSE_PROFILES`, which compose also reads from
# `--env-file`) and not only by including this file. The split matters because
# the file does two jobs. The patches — the proxy's `/chat` route, the chat's
# environment — sit on services that run in every shape and apply whenever the
# file is included, profile or not. The services themselves now wait for the
# profile, which is what lets a phase-1 set include this file for its
# configuration without starting containers nobody asked for yet. Naming a
# service explicitly still starts it (compose activates a targeted service's
# own profile), so `up ... chat proxy` keeps working unchanged. And a set that
# includes this file without the profile removes nothing: services outside the
# active model are orphans compose leaves running, so the pre-profile command
# lines keep an existing stack alive — they only stop managing the chat until
# `--profile chat` joins the line.

services:
  chat-mongo:
    # chat-ui stores conversations, users, settings and files in MongoDB. It is
    # the application's own store and nothing else reads it; the gateway's
    # PostgreSQL is untouched, which is the boundary this deployment exists to
    # keep.
    #
    # 4.4, not 8: this box's CPU has no AVX, and MongoDB has required it since
    # 5.0 — the 8 image dies at start with exit 132 (SIGILL). 4.4 is the last
    # line that runs here, and chat-ui needs nothing newer: collections,
    # indexes, GridFS. The version is the box's fact, not the application's;
    # a machine with AVX can put 8 back.
    #
    # `profiles: [chat]` — the chat add-on is one unit: chat and its MongoDB
    # travel together, selected by --profile chat (see the header). Untagged,
    # this file's presence alone would start a MongoDB nothing reads.
    profiles: [chat]
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - chat-mongo-data:/data/db
    healthcheck:
      # `mongosh` only exists from 5.0; the 4.4 image ships `mongo`. Trying
      # both keeps the healthcheck working whichever version the box runs.
      test:
        [
          "CMD-SHELL",
          "mongo --quiet --eval 'db.adminCommand(\"ping\").ok' || mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  chat:
    # Selected with its MongoDB by --profile chat (see the header). The
    # depends_on entries below are untouched by the profile: chat-mongo
    # carries the same one, and the proxy dependency is what keeps a
    # loopback set without an exposure overlay a validation error rather
    # than an unreachable chat.
    profiles: [chat]
    build:
      # An absolute path, required rather than defaulted. A relative default
      # resolves against this file's directory, which is right for a plain
      # checkout and wrong from a git worktree — `deploy/compose/../../..` is
      # two levels off there, and the error names a path nobody wrote:
      # "path /home/.../.claude/worktrees/pystino-chat not found". The chat is
      # a sibling repository at whatever address the operator cloned it to, so
      # asking is more honest than guessing.
      context: ${CHAT_REPO:?set CHAT_REPO in deploy/.env to the chat checkout}
      dockerfile: Dockerfile
      args:
        # Build-time, for the reason in the header comment.
        APP_BASE: /chat
        PUBLIC_APP_NAME: ${CHAT_APP_NAME:-Cerea}
    restart: unless-stopped
    environment:
      # Configuration arrives as one blob, not as individual variables, because
      # the image's entrypoint runs `dotenv -e /app/.env -c -- node server.js`.
      # `/app/.env` is chat-ui's committed defaults — `OPENAI_BASE_URL=` empty,
      # `USE_USER_TOKEN=false` — and passing settings through `environment:`
      # puts them in a race with that file. `DOTENV_LOCAL` is the mechanism the
      # entrypoint provides for exactly this: it writes `.env.local`, which
      # overrides `.env`.
      #
      # SvelteKit's node adapter trusts `x-forwarded-*` only when told to.
      # Without the three `*_HEADER` lines the redirect it builds is `http`,
      # and an https-registered OIDC client refuses it *after* a login that
      # appeared to work — the same trap ADR 0035 records for the gateway, in
      # a second codebase.
      DOTENV_LOCAL: |
        MONGODB_URL=mongodb://chat-mongo:27017
        MONGODB_DB_NAME=chat-ui

        # The inference backend. On gateway profiles this is the gateway inside
        # the compose network — deliberately not the public origin: a
        # server-to-server hop that never leaves the host needs no TLS and no
        # certificate to verify, and the browser never sees this URL. The
        # standalone profiles (satellite, generic) override it from deploy/.env
        # with the central /v1 or the third-party URL; unset, the gateway
        # default below holds.
        OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://gateway:8000/v1}
        # The shared key for deployments that bill one account (generic, and
        # satellite on a local IdP whose tokens central would not honour).
        # Empty on gateway profiles: GET /v1/models is public (ADR 0081), so
        # the boot fetch needs no credential and none is minted for it — and
        # an empty value reads exactly as unset in the chat (falsy everywhere
        # it is checked), so this line changes nothing where it is empty.
        OPENAI_API_KEY=${OPENAI_API_KEY:-}

        # A model-facing web fetch uses Cerea's configured fetch seam. The
        # Playwright overlay supplies the renderer on this private network;
        # keeping its address here (rather than in the chat image) means an
        # operator may still choose direct HTTPS fetch without rebuilding.
        FETCH_BACKEND=${FETCH_BACKEND:-playwright}
        PLAYWRIGHT_WS_ENDPOINT=${PLAYWRIGHT_WS_ENDPOINT:-ws://playwright:3000/}

        # The chat's own Postgres (ADR 0070): where the knowledge pipeline's
        # passages and vectors live. A separate database from the gateway's,
        # with the chat's own credentials — the store is the chat's, and
        # neither component can read the other's. Set in deploy/.env.
        CHAT_PG_URL=${CHAT_PG_URL:?set CHAT_PG_URL in deploy/.env}

        # Every inference call carries the signed-in person's own access token,
        # so the gateway bills that person (ADR 0040). Interpolated, not
        # hardcoded: the gateway-less profiles that bill a shared key
        # (generic always, satellite on a local IdP) write false here, and
        # the chat compares the string exactly — anything but "true" is
        # shared-key mode.
        USE_USER_TOKEN=${USE_USER_TOKEN:-true}
        # No anonymous mode: the gateway has nothing to bill a caller it cannot
        # identify, so a visitor who is not signed in would only see an error.
        AUTOMATIC_LOGIN=true

        # The execute_code tool: models run Python autonomously in the signed-in
        # person's own browser sandbox (park-and-resume over the stream), and
        # the results feed back into the turn so the model can iterate. Per-user
        # isolation by construction — the code never leaves the client. Off (or
        # absent) means code fences only, the manual channel. Interpolated (not
        # hardcoded) so a deployment profile can switch it per environment.
        # `${VAR-default}` (no colon): an explicitly emptied value stays empty
        # rather than falling back — that is how a profile switches a tab off.
        CHAT_CODE_TOOL_ENABLED=${CHAT_CODE_TOOL_ENABLED-true}

        # The Usage & billing settings tab (ADR 0073 amendment / ADR 0074): the
        # signed-in person's Pystino quotas and spend, read from
        # GET /v1/pystino/usage with their own bearer token. Gated because the
        # tab is a Pystino-specific capability — a deployment against a gateway
        # without it leaves this off and the tab never appears. Interpolated so
        # an unmetered profile can empty it without editing this file (same
        # no-colon form as above: empty stays empty).
        CHAT_USAGE_ENABLED=${CHAT_USAGE_ENABLED-true}

        # Whether this origin serves the Pystino console at /console — the
        # chat's admin panel links to it when set (CHAT_CONSOLE_ENABLED).
        # Default ON because the gateway profiles all serve it; the
        # standalone profiles (satellite, generic) turn it off from
        # deploy/.env — satellite's Pystino is central's and its console is
        # not this origin's to serve, generic has no Pystino at all.
        # Interpolated like the flags above so the operator's switch is
        # reachable from deploy/.env without editing this file.
        CHAT_CONSOLE_ENABLED=${CHAT_CONSOLE_ENABLED-true}

        # The knowledge pipeline (chat-owned Postgres, ADR 0070). On unless
        # "false": a deployment without that database sets it false and the
        # Knowledge tab, the project and composer affordances and the admin
        # section hide instead of erroring.
        CHAT_KNOWLEDGE_ENABLED=${CHAT_KNOWLEDGE_ENABLED-true}

        # User memory (ADR 0080): standing personal facts carried into every
        # conversation, managed on the Memory tab. On unless "false", which
        # withdraws the feature from the deployment — tab hidden, routes 404,
        # remember/forget tools never offered. Interpolated for the same reason
        # as the three flags above: without this line the operator's switch is
        # documented in the chat's own .env but unreachable from deploy/.env,
        # so setting it there would silently do nothing.
        CHAT_MEMORY_ENABLED=${CHAT_MEMORY_ENABLED-true}

        # Per-model overrides (JSON array, matched by id or name): the chat's
        # own .env documents this as MODELS, and the flags that matter here —
        # supportsArtifacts above all — are opt-in per model, so without this
        # line a deployment could never turn them on from deploy/.env. Empty
        # by default (the chat treats an empty value as no overrides), set it
        # to e.g. '[{"id":"my-model","supportsArtifacts":true}]' to teach a
        # model the artifact protocol. A malformed value logs and is ignored
        # rather than refusing to boot — a typo must not take the chat down.
        MODELS=${MODELS:-}

        # Reading documents without a gateway (ADR 0083). Empty here, which is
        # every gateway-backed profile: extraction goes through /v1/ocr with
        # the signed-in person's own token. The generic profile — no gateway
        # anywhere — sets a base URL and a key in deploy/.env instead, and the
        # chat posts to {base}/ocr directly. A base URL requires a model name:
        # there is no catalogue to discover one from, and the chat refuses to
        # start if one is set without the other.
        CHAT_OCR_BASE_URL=${CHAT_OCR_BASE_URL-}
        CHAT_OCR_API_KEY=${CHAT_OCR_API_KEY-}
        CHAT_OCR_MODEL=${CHAT_OCR_MODEL-}

        # Sign-in against the gateway's own IdP (ADR 0068). The issuer is the
        # public origin — the same value GATEWAY_IDP__ISSUER was configured
        # with, because openid-client validates the discovery document's
        # `issuer` against this URL byte for byte. The client must appear in
        # GATEWAY_IDP__CLIENTS with redirect_path /chat/login/callback, and
        # the secret must match that client's.
        #
        # An enterprise deployment authenticating against an external provider
        # instead overrides the three CHAT_OIDC_* variables (client registered
        # at the provider with <PUBLIC_ORIGIN>/chat/login/callback exactly);
        # the house-IdP values below are the defaults when they are unset.
        OPENID_PROVIDER_URL=${CHAT_OIDC_PROVIDER_URL:-${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env — it is the IdP issuer}}
        OPENID_CLIENT_ID=${CHAT_OIDC_CLIENT_ID:-cerea}
        OPENID_CLIENT_SECRET=${CHAT_OIDC_CLIENT_SECRET:-${CHAT_IDP_CLIENT_SECRET:?set CHAT_IDP_CLIENT_SECRET in deploy/.env — the cerea client's secret}}
        OPENID_SCOPES=${CHAT_OIDC_SCOPES:-openid profile email}

        # Encrypts MCP connector credentials at rest (ADR 0064) — OAuth tokens
        # and static API tokens, which used to live in browser localStorage.
        # Required rather than defaulted: a default would mean every deployment
        # that forgot shared a key, which is indistinguishable from no
        # encryption while looking like encryption.
        CHAT_SECRET_KEY=${CHAT_SECRET_KEY:?generate a long random value and set CHAT_SECRET_KEY in deploy/.env}

        PUBLIC_APP_NAME=${CHAT_APP_NAME:-Cerea}
        PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
        ORIGIN=${PUBLIC_ORIGIN}/chat
        ADDRESS_HEADER=X-Forwarded-For
        PROTOCOL_HEADER=X-Forwarded-Proto
        HOST_HEADER=X-Forwarded-Host

      # The public name carries both an A and an AAAA record, and the box has
      # no IPv6 route — the container less than anyone. Node resolves the AAAA
      # first and waits for a route that does not exist, which is why the
      # discovery fetch timed out after 3500ms while a direct TLS connection
      # on IPv4 answered instantly. IPv4 first, always, in this container.
      NODE_OPTIONS: --dns-result-order=ipv4first
      # The issuer URL is https, and on this box the only way the container
      # can reach it is the proxy's internal TLS listener — whose certificate
      # comes from Caddy's own CA. This is the same arrangement the TLS-proxy
      # deployment used: the root is trusted by mount, not by disabling
      # verification, because a fetch that skips verification is a fetch that
      # a compromised network element forges. The root is *copied* out of the
      # caddy-data volume (deploy/tls/caddy-root.crt, after the proxy's first
      # run) rather than mounted from it, for a permissions reason and a
      # coupling one: Caddy writes it 0600, which the chat's user cannot
      # read, and a ro mount of the whole volume would also carry root.key.
      NODE_EXTRA_CA_CERTS: /etc/ssl/caddy/caddy-root.crt
    volumes:
      - ../tls/caddy-root.crt:/etc/ssl/caddy/caddy-root.crt:ro
    depends_on:
      chat-mongo:
        condition: service_healthy
      proxy:
        condition: service_healthy

  # The proxy gains the /chat route. Additive, and only meaningful under the
  # proxy overlay: the edge shape routes /chat natively (Caddyfile.netbird),
  # and a deployment without this overlay serves no chat at all. Found live:
  # the file's own header claimed this mount existed while the overlay carried
  # no proxy section — every proxy-shape deployment 404'd /chat with nothing
  # in any log, and only the edge shape ever worked.
  proxy:
    volumes:
      - ../caddy/conf.d-chat/20-chat.caddy:/etc/caddy/conf.d/20-chat.caddy:ro

volumes:
  chat-mongo-data:
