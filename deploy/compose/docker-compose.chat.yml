# The chat application, on the origin already published.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml \
#     -f deploy/compose/docker-compose.chat.yml up -d
#
# ## It is a client, and this file is the proof
#
# `pystino-chat` imports nothing from the gateway: it is built from its own
# repository, talks over `/v1`, and authenticates with an OIDC access token.
# Nothing below mounts gateway source, shares its database, or reads its
# environment — the only things it is told are URLs and a client credential.
#
# ## Where it signs in (ADR 0068)
#
# Against the gateway's own IdP: `OPENID_PROVIDER_URL` is the deployment's
# public origin, which is the issuer the gateway is configured with. The chat
# backend fetches discovery once from that URL — so the edge's certificate for
# the public name must be one Node trusts without help, which a publicly
# resolvable name already implies — and then follows discovery everywhere
# else: the token endpoint, JWKS and userinfo are advertised at the gateway's
# *internal* address, so the exchanges and the key fetches never leave the
# compose network and never meet the edge at all. Only the browser's
# `/oauth/authorize` round trip is public, which is inherent to the flow.
#
# ## Nothing new is published (the fourth ground rule)
#
# No `ports:`. A browser reaches it through the origin's reverse proxy at
# `/chat` — one origin keeps the session cookie same-origin.
#
# ## Why the base path is set twice
#
# `APP_BASE=/chat` is a **build-time** value: SvelteKit bakes `paths.base` into
# the bundle, so it is an argument to `docker build` and not an environment
# variable at run time. Setting it only in `environment:` builds an application
# rooted at `/` whose every asset 404s behind the prefix.
#
# ## Its credential, and the one place a shared key remains
#
# `USE_USER_TOKEN=true` makes every inference call carry the signed-in person's
# own access token, so the gateway bills that person's group (ADR 0040) and
# `x-bill-to` can choose which one (ADR 0061).
#
# `OPENAI_API_KEY` is still needed and is **not** used for inference. chat-ui
# builds its model catalogue once at boot, before anyone has signed in, by
# fetching `${OPENAI_BASE_URL}/models` — a request with no user to attribute.
# Two consequences to know: the catalogue is whatever *that* key's user may
# reach, so it should be a key whose user sees every model the deployment
# offers; and because listing models bills nothing, the key spends nothing.
# Making the catalogue per-user needs an upstream change — the model list is a
# module-level singleton — and is not attempted here.

services:
  chat-mongo:
    # chat-ui stores conversations, users, settings and files in MongoDB. It is
    # the application's own store and nothing else reads it; the gateway's
    # PostgreSQL is untouched, which is the boundary this deployment exists to
    # keep.
    #
    # 4.4, not 8: this box's CPU has no AVX, and MongoDB has required it since
    # 5.0 — the 8 image dies at start with exit 132 (SIGILL). 4.4 is the last
    # line that runs here, and chat-ui needs nothing newer: collections,
    # indexes, GridFS. The version is the box's fact, not the application's;
    # a machine with AVX can put 8 back.
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - chat-mongo-data:/data/db
    healthcheck:
      # `mongosh` only exists from 5.0; the 4.4 image ships `mongo`. Trying
      # both keeps the healthcheck working whichever version the box runs.
      test:
        [
          "CMD-SHELL",
          "mongo --quiet --eval 'db.adminCommand(\"ping\").ok' || mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  chat:
    build:
      # An absolute path, required rather than defaulted. A relative default
      # resolves against this file's directory, which is right for a plain
      # checkout and wrong from a git worktree — `deploy/compose/../../..` is
      # two levels off there, and the error names a path nobody wrote:
      # "path /home/.../.claude/worktrees/pystino-chat not found". The chat is
      # a sibling repository at whatever address the operator cloned it to, so
      # asking is more honest than guessing.
      context: ${CHAT_REPO:?set CHAT_REPO in deploy/.env to the chat checkout}
      dockerfile: Dockerfile
      args:
        # Build-time, for the reason in the header comment.
        APP_BASE: /chat
        PUBLIC_APP_NAME: ${CHAT_APP_NAME:-Cerea}
    restart: unless-stopped
    environment:
      # Configuration arrives as one blob, not as individual variables, because
      # the image's entrypoint runs `dotenv -e /app/.env -c -- node server.js`.
      # `/app/.env` is chat-ui's committed defaults — `OPENAI_BASE_URL=` empty,
      # `USE_USER_TOKEN=false` — and passing settings through `environment:`
      # puts them in a race with that file. `DOTENV_LOCAL` is the mechanism the
      # entrypoint provides for exactly this: it writes `.env.local`, which
      # overrides `.env`.
      #
      # SvelteKit's node adapter trusts `x-forwarded-*` only when told to.
      # Without the three `*_HEADER` lines the redirect it builds is `http`,
      # and an https-registered OIDC client refuses it *after* a login that
      # appeared to work — the same trap ADR 0035 records for the gateway, in
      # a second codebase.
      DOTENV_LOCAL: |
        MONGODB_URL=mongodb://chat-mongo:27017
        MONGODB_DB_NAME=chat-ui

        # The gateway, inside the compose network. Deliberately not the public
        # origin: a server-to-server hop that never leaves the host needs no
        # TLS and no certificate to verify, and the browser never sees this URL.
        OPENAI_BASE_URL=http://gateway:8000/v1
        OPENAI_API_KEY=${CHAT_CATALOGUE_KEY:?mint a gwk_ key and set CHAT_CATALOGUE_KEY in deploy/.env}

        # A model-facing web fetch uses Cerea's configured fetch seam. The
        # Playwright overlay supplies the renderer on this private network;
        # keeping its address here (rather than in the chat image) means an
        # operator may still choose direct HTTPS fetch without rebuilding.
        FETCH_BACKEND=${FETCH_BACKEND:-playwright}
        PLAYWRIGHT_WS_ENDPOINT=${PLAYWRIGHT_WS_ENDPOINT:-ws://playwright:3000/}

        # The chat's own Postgres (ADR 0070): where the knowledge pipeline's
        # passages and vectors live. A separate database from the gateway's,
        # with the chat's own credentials — the store is the chat's, and
        # neither component can read the other's. Set in deploy/.env.
        CHAT_PG_URL=${CHAT_PG_URL:?set CHAT_PG_URL in deploy/.env}

        # Every inference call carries the signed-in person's own access token,
        # so the gateway bills that person (ADR 0040).
        USE_USER_TOKEN=true
        # No anonymous mode: the gateway has nothing to bill a caller it cannot
        # identify, so a visitor who is not signed in would only see an error.
        AUTOMATIC_LOGIN=true

        # Sign-in against the gateway's own IdP (ADR 0068). The issuer is the
        # public origin — the same value GATEWAY_IDP__ISSUER was configured
        # with, because openid-client validates the discovery document's
        # `issuer` against this URL byte for byte. The client must appear in
        # GATEWAY_IDP__CLIENTS with redirect_path /chat/login/callback, and
        # the secret must match that client's.
        OPENID_PROVIDER_URL=${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env — it is the IdP issuer}
        OPENID_CLIENT_ID=cerea
        OPENID_CLIENT_SECRET=${CHAT_IDP_CLIENT_SECRET:?set CHAT_IDP_CLIENT_SECRET in deploy/.env — the cerea client's secret}
        OPENID_SCOPES=openid profile email

        # Encrypts MCP connector credentials at rest (ADR 0064) — OAuth tokens
        # and static API tokens, which used to live in browser localStorage.
        # Required rather than defaulted: a default would mean every deployment
        # that forgot shared a key, which is indistinguishable from no
        # encryption while looking like encryption.
        CHAT_SECRET_KEY=${CHAT_SECRET_KEY:?generate a long random value and set CHAT_SECRET_KEY in deploy/.env}

        PUBLIC_APP_NAME=${CHAT_APP_NAME:-Cerea}
        PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
        ORIGIN=${PUBLIC_ORIGIN}/chat
        ADDRESS_HEADER=X-Forwarded-For
        PROTOCOL_HEADER=X-Forwarded-Proto
        HOST_HEADER=X-Forwarded-Host

      # The public name carries both an A and an AAAA record, and the box has
      # no IPv6 route — the container less than anyone. Node resolves the AAAA
      # first and waits for a route that does not exist, which is why the
      # discovery fetch timed out after 3500ms while a direct TLS connection
      # on IPv4 answered instantly. IPv4 first, always, in this container.
      NODE_OPTIONS: --dns-result-order=ipv4first
      # The issuer URL is https, and on this box the only way the container
      # can reach it is the proxy's internal TLS listener — whose certificate
      # comes from Caddy's own CA. This is the same arrangement the TLS-proxy
      # deployment used: the root is trusted by mount, not by disabling
      # verification, because a fetch that skips verification is a fetch that
      # a compromised network element forges. The root is *copied* out of the
      # caddy-data volume (deploy/tls/caddy-root.crt, after the proxy's first
      # run) rather than mounted from it, for a permissions reason and a
      # coupling one: Caddy writes it 0600, which the chat's user cannot
      # read, and a ro mount of the whole volume would also carry root.key.
      NODE_EXTRA_CA_CERTS: /etc/ssl/caddy/caddy-root.crt
    volumes:
      - ../tls/caddy-root.crt:/etc/ssl/caddy/caddy-root.crt:ro
    depends_on:
      chat-mongo:
        condition: service_healthy
      proxy:
        condition: service_healthy

volumes:
  chat-mongo-data:
