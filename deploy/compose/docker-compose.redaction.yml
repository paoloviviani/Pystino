# Overlay that adds PII detection and switches the gateway from the no-op engine
# to the HTTP one.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml up --build
#
#   ./scripts/test_redaction_live.py
#
# The default build is MIT-licensed throughout and detects Italian *identifiers*
# (fiscal code, VAT, ID card, driving licence, passport) but not Italian personal
# names — those need a spaCy model licensed CC BY-NC-SA 3.0. To accept that
# obligation and add it, build with:
#
#   SPACY_MODELS="en_core_web_lg it_core_news_lg" docker compose ... build redaction
#
# Three deployment shapes, and how to get each:
#
#   Presidio + NER (default)   SPACY_MODELS="en_core_web_lg" — the model loads at
#                              startup and PERSON/LOCATION/NRP/ORGANIZATION are
#                              detectable. ~900 MB of RAM.
#   Presidio, no NER           SPACY_MODELS= (empty build) AND
#                              REDACTION_NLP_ENGINE=disabled — no model loads, the
#                              pattern and checksum recognisers work, and
#                              /healthz reports the model-backed entities as
#                              absent so the console hides them. ~150 MB.
#   Redaction off              drop this overlay and set
#                              GATEWAY_REDACTION__ENGINE=noop on the gateway.
#
# See docs/adr/0026-pluggable-detection.md and services/redaction/README.md.
services:
  redaction:
    build:
      context: ../..
      dockerfile: services/redaction/Dockerfile
      args:
        SPACY_MODELS: ${SPACY_MODELS:-en_core_web_lg}
    environment:
      # With models installed this stays "spacy" (the default) and they load.
      # Set "disabled" to run pattern-only; it must match the build — a no-NER
      # service in a model-carrying image simply wastes the 425 MB of weights,
      # and a spacy service in a model-less image fails visibly at startup
      # rather than detecting nothing.
      REDACTION_NLP_ENGINE: ${REDACTION_NLP_ENGINE:-spacy}
    # Deliberately no `ports:`. The service has no authentication of its own
    # because it is not reachable from outside the compose network; publishing it
    # would make that assumption false.
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      # Loading spaCy takes seconds and the image is large; a short start period
      # would have the orchestrator kill a container that is merely warming up.
      retries: 5
      start_period: 180s

  # Published only under this overlay, so the redaction check can read what the
  # gateway actually sent. A development fake; nothing else exposes it.
  fake-upstream:
    ports:
      - "8081:9099"

  gateway:
    environment:
      GATEWAY_REDACTION__ENGINE: http
      GATEWAY_REDACTION__ENDPOINT: http://redaction:8080
      # The HMAC key placeholders are derived from. It must stay stable for as
      # long as the transcripts it labelled are kept: rotating it re-labels every
      # entity. Generate a real one for anything but a demo.
      GATEWAY_REDACTION__PLACEHOLDER_KEY: ${REDACTION_PLACEHOLDER_KEY:-dev-placeholder-key-not-for-production}
      GATEWAY_REDACTION__LANGUAGE: ${REDACTION_LANGUAGE:-en}
      GATEWAY_REDACTION__SCORE_THRESHOLD: "0.5"
      # Fail closed: if the detector is unreachable the request is refused rather
      # than forwarded unredacted. A redaction layer that silently stops
      # redacting is worse than an outage, because nobody finds out.
      GATEWAY_REDACTION__FAIL_OPEN: "false"
    depends_on:
      redaction:
        condition: service_healthy
