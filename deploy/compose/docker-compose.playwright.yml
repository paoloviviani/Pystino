# Overlay that adds a headless browser the stack can drive over the wire: one
# Playwright server, three browser engines, no port on the host.
#
#   docker compose --env-file deploy/.env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.smoke.yml \
#     -f deploy/compose/docker-compose.redaction.yml \
#     -f deploy/compose/docker-compose.playwright.yml up -d
#
# **Deployed ahead of its consumer, deliberately.** Nothing in this repository
# connects to it today. It exists for web search phases 2 and 3
# (docs/web-search-plan.md): a search backend returns URLs and snippets, and
# turning those into text a model can read means fetching and *rendering* the
# page, because a growing share of the web is empty without JavaScript. Reading
# the page is a second egress and the search query is the first, so the thing
# that fetches it belongs inside this deployment rather than at a third party.
# docs/browser.md carries the rest of the reasoning, including why it is not in
# the default overlay set.
#
# Two decisions are load-bearing. Both are about the same fact:
#
#   **`run-server` is remote code execution as a feature, and it has no
#   authentication of any kind.** Anyone who can open a WebSocket to it can
#   navigate to any URL, run arbitrary JavaScript in a real browser, read the
#   container's filesystem through `file://`, and reach every other service on
#   the compose network from inside the trust boundary. There is no token, no
#   password and no TLS — Playwright does not offer one. The only thing standing
#   between that and the internet is the absence of a published port.
services:
  playwright:
    # Pinned to 1.61.1, and the version is not a matter of taste. Measured on
    # 2026-09-11 against the real servers: the ws handshake compares client and
    # server at *minor* granularity and refuses a mismatch with `428
    # Precondition Required` — a 1.62.0 client against a 1.61.1 server got
    # "Playwright version mismatch: server v1.61, client v1.62" and no browser
    # at all. So the pin is whatever the **consumer** can install, and this was
    # first pinned to 1.62.1 on the assumption that the consumer would be the
    # Python gateway.
    #
    # It is not. Fetching a URL somebody named belongs to the chat, so the
    # consumer is the chat's Node client — and the chat has **1.61.1**
    # installed. 1.62.1 would have been refused by the only thing that calls it.
    #
    # 1.61.1 also keeps the other door open: PyPI carries 1.61.x as well as
    # 1.62.0, so a future Python consumer can still pair with this server, while
    # a 1.62 server could not have paired with the chat. When one of the two
    # moves, both move — the chat now pins `1.61.1` exactly rather than
    # `^1.55.1`, because a caret range against this protocol is a silent outage
    # waiting for an unrelated `npm install`.
    #
    # PLAYWRIGHT_VERSION is interpolated into both the image tag and the command
    # on purpose: the image carries the browser binaries and the command chooses
    # the driver that must match them, so two literals here would be two places
    # to forget.
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.61.1}-noble
    # The image ships the browsers and *not* the `playwright` npm package —
    # checked: `npm ls -g` in v1.62.0-noble lists only corepack, npm and yarn.
    # So `npx` is not laziness, it is how this image is meant to be started, and
    # it means the container fetches ~2 MB from the npm registry on every start.
    # A registry outage is therefore a failed start rather than a degraded
    # service; that is accepted here because nothing depends on this yet, and
    # the alternative — our own image layer on top of a 3.5 GB base — is a build
    # to maintain for a service with no consumer. Revisit when one exists.
    #
    # `--host 0.0.0.0` binds every interface *inside the container*, which is
    # required for any other compose service to reach it at all; a container
    # binding 127.0.0.1 is reachable only by itself. It is safe only because
    # there is no `ports:` below, and those two lines have to be read together.
    command:
      - npx
      - "-y"
      - playwright@${PLAYWRIGHT_VERSION:-1.61.1}
      - run-server
      - --port
      - "3000"
      - --host
      - 0.0.0.0
    # Deliberately no `ports:`, and this is the strongest case in the stack for
    # that rule — stronger than redaction's, which merely lacks authentication.
    # Publishing this on 0.0.0.0 hands anyone who can reach the host a scriptable
    # browser running inside the compose network: an unauthenticated SSRF pivot
    # onto PostgreSQL, Valkey and the gateway's own port, plus `file://` reads of
    # this container. CLAUDE.md's fourth ground rule says nothing but the proxy's
    # TLS port may be published; this service is not an exception to argue about
    # later, because Caddy cannot fix it either — there is no credential for a
    # reverse proxy to check. `scripts/test_public_tls_live.py` asserts that
    # nothing else answers on a routable address, and 3000 stays off that list
    # only for as long as this line stays absent.
    #
    # Reaching it from the host for debugging is a deliberate act and a
    # temporary one: `docker compose ... run --rm --publish 127.0.0.1:3000:3000
    # playwright`, loopback only, or an SSH tunnel.
    user: pwuser
    # A browser is the process most likely to be running someone else's code, so
    # it does not run as root. `pwuser` is in the image for this reason.
    init: true
    # Chromium forks liberally and does not reap; without an init as PID 1 a
    # long-lived server accumulates zombies until the pid limit stops it.
    shm_size: 1gb
    # Chromium's renderers share memory through /dev/shm, and Docker's default
    # 64 MB is small enough that a heavy page kills the tab with SIGBUS —
    # reported as a crashed target with no explanation. Playwright's own advice
    # is `--ipc=host`, which fixes it by sharing the *host's* IPC namespace; a
    # bigger /dev/shm fixes the same thing without giving a browser that reach.
    restart: unless-stopped
    healthcheck:
      # `run-server` answers a plain GET on the same port with 200, so this
      # proves the listener is up and serving. It does not prove a client can
      # connect: the version check happens during the WebSocket upgrade, so a
      # mismatched client gets 428 from a server that is healthy by this probe
      # and correct to be. The pin above is what guards that, not the healthcheck.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get({host:'127.0.0.1',port:3000,timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # The npm fetch is the slow part of a cold start, not the server.
      start_period: 60s
