# Publish the Pystino images — from main and release tags only (the GitHub free
# plan's Action minutes are the budget; PRs never build images).
#
# Packages are PRIVATE while the repository is: pushed with GITHUB_TOKEN from a
# private repository they inherit its visibility, and pulling needs
# `docker login ghcr.io` with a read:packages token. Going public later is the
# package's own setting (Package settings → Danger Zone → Change visibility).
#
# Lean on minutes and on storage (private packages count against the plan):
#   - path filters: a push that touches none of the images' inputs runs nothing;
#   - the GHA layer cache: an image whose inputs did not change rebuilds from
#     cache in well under a minute;
#   - main → `edge`, vX.Y.Z → `X.Y.Z` + `X.Y` (never overwritten), no per-commit
#     tags — releases pin by digest (`pystino release-pin`);
#   - one cleanup job (not one per image: every job is billed rounded up to a
#     whole minute) keeping the newest five untagged versions per image;
#   - no provenance/SBOM attestations (they are stored as untagged manifests,
#     and pruning those would break the images).
name: images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "apps/gateway/**"
      - "apps/console/**"
      - "packages/**"
      - "services/redaction/**"
      - "deploy/stack/**"
      - "uv.lock"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false  # never cancel a push half-way

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The four images the stack runs; nothing else is built here.
        include:
          - image: pystino-gateway
            context: .
            file: apps/gateway/Dockerfile
            build-args: INCLUDE_CONSOLE=true
            suffix: ""
          - image: pystino-proxy
            context: deploy/stack/proxy
            file: deploy/stack/proxy/Dockerfile
            build-args: ""
            suffix: ""
          - image: pystino-authelia
            context: deploy/stack/authelia
            file: deploy/stack/authelia/Dockerfile
            build-args: ""
            suffix: ""
          # Pattern-only; the NER model is CC BY-NC-SA and is built locally (D6).
          - image: pystino-redaction
            context: .
            file: services/redaction/Dockerfile
            build-args: SPACY_MODELS=
            suffix: "-pattern"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}${{ matrix.suffix }}"
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:$tag" >/dev/null 2>&1; then
            echo "::error::${{ matrix.image }}:$tag already exists; a release tag is immutable"; exit 1
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=EUPL-1.2
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.build-args }}
            CONSOLE_BUILD_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
          sbom: false
      - name: Record the digest
        run: echo "${{ matrix.image }}${{ matrix.suffix }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with: {package-name: pystino-gateway, package-type: container, delete-only-untagged-versions: "true", min-versions-to-keep: 5}
      - uses: actions/delete-package-versions@v5
        with: {package-name: pystino-proxy, package-type: container, delete-only-untagged-versions: "true", min-versions-to-keep: 5}
      - uses: actions/delete-package-versions@v5
        with: {package-name: pystino-authelia, package-type: container, delete-only-untagged-versions: "true", min-versions-to-keep: 5}
      - uses: actions/delete-package-versions@v5
        with: {package-name: pystino-redaction, package-type: container, delete-only-untagged-versions: "true", min-versions-to-keep: 5}

  # A release names every image by digest; refuse a tag that does not.
  release-pins:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv run --package gateway pystino release-pin --check
