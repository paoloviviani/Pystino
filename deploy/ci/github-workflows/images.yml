# Build the Pystino images on every PR; publish them from main and tags.
#
# Publishing is OFF until the repository variable PUBLISH_IMAGES is set to
# "true" (Settings → Variables). Until then every run builds and throws the
# result away, which still proves each Dockerfile builds from a clean checkout
# — the thing a locally built image never proved. (Report §6, ADR 0086.)
#
# Tags:
#   main       sha-<7>, edge
#   vX.Y.Z     X.Y.Z, X.Y, latest
# Redaction publishes only the pattern-only variant (suffix -pattern); the NER
# variant carries a CC BY-NC-SA model and is built locally (decision D6).
name: images

on:
  pull_request:
    paths:
      - "apps/gateway/**"
      - "apps/console/**"
      - "packages/**"
      - "services/redaction/**"
      - "deploy/stack/**"
      - "uv.lock"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ vars.PUBLISH_IMAGES == 'true' && github.event_name != 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pystino-gateway
            context: .
            file: apps/gateway/Dockerfile
            build-args: |
              INCLUDE_CONSOLE=true
            suffix: ""
          - image: pystino-proxy
            context: deploy/stack/proxy
            file: deploy/stack/proxy/Dockerfile
            build-args: ""
            suffix: ""
          - image: pystino-authelia
            context: deploy/stack/authelia
            file: deploy/stack/authelia/Dockerfile
            build-args: ""
            suffix: ""
          - image: pystino-redaction
            context: .
            file: services/redaction/Dockerfile
            build-args: |
              SPACY_MODELS=
            suffix: "-pattern"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=EUPL-1.2

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.build-args }}
            CONSOLE_BUILD_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Attestations need an image to attach to, so only when pushing.
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}

  # The stack files' invariants, and a compose/Caddy parse of what init writes,
  # without starting anything. The fresh-install job lives in stack.yml.
  stack-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Deploy unit tests
        run: uv run pytest -q apps/gateway/tests/test_deploy_envfile.py apps/gateway/tests/test_deploy_init.py apps/gateway/tests/test_deploy_bootstrap.py apps/gateway/tests/test_deploy_stack.py apps/gateway/tests/test_oidc_backchannel.py
      - name: init writes a file compose accepts (both modes)
        run: |
          set -eu
          for mode in dist dev; do
            dir="$RUNNER_TEMP/$mode"; mkdir -p "$dir"
            PYSTINO_UPSTREAM_API_KEY= uv run pystino init --dir "$dir" --mode "$mode" \
              --origin https://stack.example.org --admin-email ops@example.org --preset team
            (cd "$dir" && docker compose config --quiet && docker compose --profile '*' config --services)
          done
      - name: The Caddyfile adapts in every TLS mode
        run: |
          set -eu
          for spec in "https://stack.example.org|" "https://10.0.0.5|tls internal" "http://:80|"; do
            site="${spec%%|*}"; tls="${spec#*|}"
            docker run --rm -e SITE_ADDRESS="$site" -e TLS_DIRECTIVE="$tls" \
              -v "$PWD/deploy/stack/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2.11-alpine sh -c 'mkdir -p /etc/caddy/extra && caddy adapt --config /etc/caddy/Caddyfile >/dev/null && echo "ok: $SITE_ADDRESS"'
          done
