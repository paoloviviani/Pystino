# PR checks for the console: typecheck + unit tests, one job, path-filtered,
# pnpm store cached, superseded runs cancelled (GitHub free plan).
name: ci-console

on:
  pull_request:
    paths:
      - "apps/console/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-console.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile --filter "@llmp/console..."
      - name: Typecheck
        run: pnpm --filter @llmp/console typecheck
      - name: Unit tests
        run: pnpm --filter @llmp/console test
