# Early warning for opencode churn: the machine agent's real-opencode
# integration tests (opencode serve and opencode acp, against the in-process
# mock LLM) run against opencode's latest release. Scheduled only, never on a
# push or PR, so it cannot block a merge; one job, no matrix, capped at 15
# minutes to stay light on the free plan's Action minutes.
name: opencode latest (agent IT)

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-it:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/agent/go.mod
          cache-dependency-path: deploy/agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install opencode (latest)
        run: npm install -g opencode-ai@latest && opencode --version
      - name: Real-opencode integration tests
        env:
          PYSTINO_AGENT_OPENCODE_IT: "1"
          PYSTINO_AGENT_ACP_IT: "1"
        run: go test -count=1 -run Integration -v .
