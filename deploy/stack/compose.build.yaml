# Development mode: the same services as compose.yaml, built from local
# checkouts instead of pulled. Listed after compose.yaml in COMPOSE_FILE
# (pystino init --mode dev writes that), and never copied into a distributed
# install. It adds build: stanzas and nothing else — no environment, no ports,
# no volumes — so a stack that works here works when pulled.
#
# Images get the names compose.yaml gives them; init sets PYSTINO_REGISTRY=local
# and PYSTINO_VERSION=dev, so a dev build is local/pystino-gateway:dev and can
# never be mistaken for, or pushed over, a published tag. BUILD_REVISION is
# stamped into every image so `pystino doctor` can say which commit is running
# and whether the tree was dirty (the chat image built from a mutable checkout
# carried no such record).
#
# Cerea's build is a separate file (compose.build-cerea.yaml), listed only
# when CEREA_SRC is set: a dev stack may build the gateway while pulling a
# released chat.

services:
  migrate:
    build: &gateway-build
      context: ${PYSTINO_SRC:?set PYSTINO_SRC in .env to the Pystino checkout}
      dockerfile: apps/gateway/Dockerfile
      args:
        INCLUDE_CONSOLE: "true"
        CONSOLE_BUILD_SHA: ${BUILD_REVISION:-unknown}
      labels:
        org.opencontainers.image.revision: ${BUILD_REVISION:-unknown}
  bootstrap:
    build: *gateway-build
  gateway:
    build: *gateway-build
  proxy:
    build:
      context: ${PYSTINO_SRC}/deploy/stack/proxy
      labels:
        org.opencontainers.image.revision: ${BUILD_REVISION:-unknown}
  authelia:
    build:
      context: ${PYSTINO_SRC}/deploy/stack/authelia
      labels:
        org.opencontainers.image.revision: ${BUILD_REVISION:-unknown}
  redaction:
    build: &redaction-build
      context: ${PYSTINO_SRC}
      dockerfile: services/redaction/Dockerfile
      args:
        # Empty is the pattern-only variant (published); en_core_web_lg is the
        # NER variant, built locally only (its model is CC BY-NC-SA 3.0).
        SPACY_MODELS: ${SPACY_MODELS:-}
      labels:
        org.opencontainers.image.revision: ${BUILD_REVISION:-unknown}
  extractor:
    build: *redaction-build
