# Development only: a fake upstream so the stack answers /v1 without a real
# provider. Never part of a distributed install (ADR 0076's rule: a fake
# upstream must never be one careless file away from production) — it lives
# outside deploy/stack/ and needs the checkout's scripts/.
#
#   append ":$PYSTINO_SRC/deploy/dev/smoke.yml" to COMPOSE_FILE in .env,
#   then docker compose up -d --wait
services:
  fake-upstream:
    image: ${GATEWAY_IMAGE:-${PYSTINO_REGISTRY:-local}/pystino-gateway:${PYSTINO_VERSION:-dev}}
    volumes:
      - ${PYSTINO_SRC:?the smoke fixture needs PYSTINO_SRC (a development install)}/scripts:/app/scripts:ro
    working_dir: /app/scripts
    command: ["python", "-m", "uvicorn", "_fake_upstream:app", "--host", "0.0.0.0", "--port", "9099"]
    ports:
      - "127.0.0.1:${FAKE_UPSTREAM_PORT:-8081}:9099"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,urllib.error,sys\ntry:\n urllib.request.urlopen('http://localhost:9099/v1/chat/completions', timeout=3)\nexcept urllib.error.HTTPError:\n sys.exit(0)\nexcept Exception:\n sys.exit(1)\""]
      interval: 5s
      timeout: 5s
      retries: 10
  gateway:
    environment:
      GATEWAY_UPSTREAM__BASE_URL: http://fake-upstream:9099/v1
      GATEWAY_UPSTREAM__API_KEY: fake-upstream-key
      GATEWAY_LOG_JSON: "false"
    depends_on:
      fake-upstream:
        condition: service_healthy
  migrate:
    environment:
      GATEWAY_UPSTREAM__BASE_URL: http://fake-upstream:9099/v1
      GATEWAY_UPSTREAM__API_KEY: fake-upstream-key
