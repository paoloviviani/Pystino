# Documentation site. Built with `uv run mkdocs build --strict`; served locally
# with `uv run mkdocs serve`. Strict because a link that silently 404s is a
# document that lies — the same reason no test is allowed to skip silently.
#
# mkdocs-material is MIT, mkdocs BSD-2-Clause, pymdown-extensions MIT and
# pygments BSD-2-Clause — all OSI-approved, checked in the installed package
# metadata on 2026-08-31 (ADR 0001's inbound licence policy).

site_name: Pystino
# GitHub Pages (the docs workflow publishes on docs/mkdocs changes):
# https://paoloviviani.github.io/Pystino/ — canonical, so strict builds
# generate honest absolute links.
site_url: https://paoloviviani.github.io/Pystino/
site_description: >
  A self-hosted model gateway: OpenAI-compatible, with per-user and
  per-group accounting, quotas and redaction, and the console that operates it.
repo_url: https://github.com/paoloviviani/Pystino
repo_name: paoloviviani/Pystino
copyright: Copyright &copy; Paolo Viviani — <a href="https://github.com/paoloviviani/Pystino/blob/main/LICENSE">Apache-2.0</a>

strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # The Development page is CONTRIBUTING.md, included from the repository
  # root; check_paths fails the strict build if the file is missing.
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.superfences

# Warnings fail the build (strict). "not_found" is the one that matters: it
# catches every internal link whose target does not exist. Anchor checking is
# on too — a link to a heading that was renamed is the same lie, quieter.
validation:
  omitted_files: warn
  absolute_links: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Gateway: gateway.md
  - Accounting and quotas: accounting-and-quotas.md
  - Redaction: redaction.md
  - Deployment: deployment.md
  - Coding agents: coding-agents.md
  - Console: console.md
  - Operations:
      - operations.md
      - "Measured performance": performance.md
  - Development: development.md
  - Identity:
      - identity.md
      - "Bundled accounts": bundled-accounts.md
      - "The OIDC provider": oidc-generic-provider.md
