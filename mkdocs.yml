# Documentation site. Built with `uv run mkdocs build --strict`; served locally
# with `uv run mkdocs serve`. Strict because a link that silently 404s is a
# document that lies — the same reason no test is allowed to skip silently.
#
# mkdocs-material is MIT, mkdocs BSD-2-Clause, pymdown-extensions MIT and
# pygments BSD-2-Clause — all OSI-approved, checked in the installed package
# metadata on 2026-08-31 (ADR 0001's inbound licence policy).

site_name: Pystino
site_description: >
  A self-hosted model gateway: OpenAI-compatible, with per-user and
  per-group accounting, quotas and redaction, and the console that operates it.
repo_url: https://github.com/paoloviviani/Pistin-Gateway
repo_name: paoloviviani/Pistin-Gateway
copyright: Copyright &copy; LINKS Foundation — <a href="https://github.com/paoloviviani/Pistin-Gateway/blob/main/LICENCE">EUPL-1.2</a>

strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Warnings fail the build (strict). "not_found" is the one that matters: it
# catches every internal link whose target does not exist. Anchor checking is
# on too — a link to a heading that was renamed is the same lie, quieter.
validation:
  omitted_files: warn
  absolute_links: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Gateway: gateway.md
  - Accounting and quotas: accounting-and-quotas.md
  - Redaction: redaction.md
  - Deployment: deployment.md
  - Operations:
      - operations.md
      - "Measured performance": performance.md
  - Guides:
      - "OIDC against any provider": oidc-generic-provider.md
      - "Cache accounting findings": cache-accounting-findings.md
  - Plans:
      - "Redaction scoping — design": redaction-scoping-design.md
      - "Redaction scoping — plan": redaction-scoping-plan.md
      - "Web search — priced, then the rest": web-search-plan.md
  # No decisions page. The record is internal, so an index of links into it
  # would be a list of URLs nobody reading these docs can open. Code and
  # comments cite by number instead.
