# Built-in facts, read from the provider's own pages on 2026-10-23 (see sources). Only what
# the provider states is recorded; where it does not say, the value is left null
# or marked not published, never guessed. Re-verify before relying on it.
providers:
  - id: mistral
    name: Mistral AI
    plugin: mistral
    base_url: https://api.eu.mistral.ai/v1
    region: eu
    region_note: >-
      Uses the EU regional endpoint api.eu.mistral.ai: inference is processed
      in data centres in EU and EFTA countries. Mistral also says data is
      hosted in the EU by default. Regional inference is billed at 1.1x list
      pricing (a 10% upcharge). Account, billing and usage metadata may still
      be handled outside the region. The EU endpoint does not offer Agents,
      Batch or the Files API. The global endpoint api.mistral.ai makes no
      inference-location commitment.
    retention:
      status: published
      zero_data_retention: false
      zero_data_retention_available: true
      retention_days: 30
      note: >-
        Inputs and outputs are kept for the time needed to answer, then 30
        rolling days for abuse monitoring, unless ZDR is activated (Agents API:
        until the account ends). ZDR is on request for paid plans and stateless
        endpoints, approved at Mistral's discretion. Training on API data by
        default is not stated clearly: the DPA allows training unless the
        customer has opted out, and an opt-out exists.
    sources:
      - url: https://legal.mistral.ai/terms/privacy-policy/
        retrieved: 2026-10-23
        covers: retention, training
      - url: https://docs.mistral.ai/admin/monitor-comply/zero-data-retention
        retrieved: 2026-10-23
        covers: zero data retention
      - url: https://docs.mistral.ai/inference/regional-inference
        retrieved: 2026-10-23
        covers: location, endpoint, EU upcharge
      - url: https://help.mistral.ai/en/articles/347629-where-do-you-store-my-data-or-my-organization-s-data
        retrieved: 2026-10-23
        covers: location
      - url: https://legal.mistral.ai/terms/data-processing-addendum/
        retrieved: 2026-10-23
        covers: training
