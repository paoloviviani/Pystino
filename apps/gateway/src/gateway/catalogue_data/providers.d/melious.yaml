# Built-in facts, read from the provider's own pages on 2026-11-06 (see sources). Only what
# the provider states is recorded; where it does not say, the value is left null
# or marked not published, never guessed. Re-verify before relying on it.
providers:
  - id: melious
    name: Melious
    plugin: melious
    base_url: https://api.melious.ai/v1
    region: eu
    region_note: >-
      Melious says every inference request runs on a provider inside the EU,
      that the request and response never leave it, and that there is no
      non-EU fallback when capacity is tight. It is a network of inference
      providers (observed in responses: OVHcloud in France, Melious itself in
      Finland); which one serves a request is Melious's choice. The company is
      Melious AI GmbH, Saarbruecken, Germany. A narrower guarantee (for
      example Germany only) is available on request.
    retention:
      status: published
      zero_data_retention_available: false
      trains_on_customer_data: false
      note: >-
        Melious says it does not log the content of prompts or responses, only
        operational metadata (request id, token counts, model, provider, energy
        and cost). A provider on its network may keep short-lived operational
        logs for stability monitoring; none retains content to train on, and
        none of it leaves the EU. Files uploaded to its Files API are stored
        encrypted until deleted (the gateway does not use that API). No
        retention period is published. For GDPR specifics Melious points to
        its DPA.
    sources:
      - url: https://melious.ai/docs/concepts/privacy
        retrieved: 2026-11-06
        covers: location, retention, training
      - url: https://melious.ai/docs/concepts/pricing
        retrieved: 2026-11-06
        covers: billing currency (credits are EUR)
      - url: https://melious.ai/pricing
        retrieved: 2026-11-06
        covers: per-model prices
    # Prices: EUR per million tokens, as Melious's Hub pages and pricing page
    # list them (https://melious.ai/hub/models/<id>), read 2026-11-06. Melious
    # publishes no price API: GET /v1/models carries ids only. So discovery
    # fills every model it lists from these hints without the operator ticking
    # "fill missing prices" (plugins/melious.py, price_hints_always).
    #
    # Hub pages round to two decimals: the embedding rates (EUR 0.01, 0.03)
    # may be rounded from smaller figures. Re-check on the Hub before relying
    # on them.
    #
    # NOT LISTED HERE, so imported unpriced and refused until a price is typed:
    #  * the image models (flux-2-*) and speech-to-text models (whisper-large-v3*):
    #    the Hub shows EUR 0.00 per token and no per-image or per-minute rate.
    #  * qwen3guard-gen-8b: it has no Hub page.
    # Embedding and decision models are billed per input token only, so their output rate is 0.
    prices:
      bge-m3:
        - effective_from: 2026-11-06
          input_per_mtok: "0.01"
          output_per_mtok: "0"
