# Built-in facts, read from the provider's own pages on 2026-10-23, prices on 2026-11-02 (see sources). Only what
# the provider states is recorded; where it does not say, the value is left null
# or marked not published, never guessed. Re-verify before relying on it.
providers:
  - id: anthropic
    name: Anthropic
    plugin: anthropic
    region: global
    region_note: >-
      Default inference_geo is "global": inference may run in any available
      geography. "us" pins inference to US infrastructure (priced 1.1x; Claude
      4.6 and later; Claude API and Claude Platform on AWS only). Workspace
      geo (data at rest) is US only. No EU-only option is published.
    retention:
      status: published
      zero_data_retention: false
      zero_data_retention_available: true
      retention_days: 30
      trains_on_customer_data: false
      note: >-
        Inputs and outputs are deleted from the backend within 30 days; up to
        2 years if flagged by trust and safety. ZDR is by agreement: contact
        Anthropic sales, enabled per organization. Some models require 30-day
        retention and are not available under ZDR. Commercial inputs and
        outputs are not used for training by default.
    # Prices: USD per million tokens, from Anthropic's public pricing page
    # (https://platform.claude.com/docs/en/about-claude/pricing), read 2026-11-02.
    # Anthropic publishes no price API, so these are hints, applied by model
    # discovery for every model the API lists (plugins/anthropic.py,
    # price_hints_always). A listed model with no row here is offered unpriced
    # and cannot be imported without a typed price.
    #
    # cache_write_per_mtok is the 5-minute write rate (1.25x input). One-hour
    # writes are billed at 1.6x that (2x input; accounting.cost.CACHE_WRITE_1H_FACTOR),
    # which holds on every row of the page. Cache reads are 0.1x input except
    # Opus 5.5 and Sonnet 5.5 (0.05x) and Fable 5.1 / Mythos 5.1 (0.025x).
    #
    # NOT EXPRESSIBLE HERE, and so under-billed if it applies:
    #  * claude-haiku-5-5 is priced per prompt size: the rates below are for
    #    prompts up to 100,000 tokens; above that it is $0.50 in / $2.50 out /
    #    $0.625 write / $0.05 read / $1 1h write. A price row has one rate.
    #  * inference_geo "us" costs 1.1x on every rate (Claude 4.6 and later);
    #    the gateway never sends inference_geo, so it does not apply.
    # Claude 4.7 and later use a tokenizer that makes ~30% more tokens for the
    # same text; usage reports what was billed, so nothing to adjust.
    prices:
      claude-fable-5-1:
        - effective_from: 2026-11-02
          input_per_mtok: "10"
          output_per_mtok: "50"
          cache_read_per_mtok: "0.25"
          cache_write_per_mtok: "12.50"
          currency: USD
      claude-mythos-5-1:
