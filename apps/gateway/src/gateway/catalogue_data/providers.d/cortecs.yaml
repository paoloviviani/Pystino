# Built-in facts, read from the provider's own pages on 2026-10-23 (see sources). Only what
# the provider states is recorded; where it does not say, the value is left null
# or marked not published, never guessed. Re-verify before relying on it.
providers:
  - id: cortecs
    name: Cortecs
    plugin: cortecs
    base_url: https://api.cortecs.ai/v1
    region: various
    region_note: >-
      A router: location depends on the upstream that serves the request. By
      default Cortecs says requests remain within Europe; the Sovereign Cloud
      setting (eu_native) restricts routing to EU-based providers. Without it,
      endpoints of non-EU companies (Microsoft, Google, AWS) may be used.
    retention:
      status: various
      zero_data_retention_available: true
      trains_on_customer_data: false
      note: >-
        Retention depends on the upstream (0 days for most listed providers, 30
        days for Microsoft). Enable Zero Data Retention in project settings, or
        send allow_zero_data_retention, to route only to zero-retention
        endpoints. Cortecs says data is never used for training, whichever
        upstream serves it.
    sources:
      - url: https://docs.cortecs.ai/security-and-compliance/zero-data-retention-zdr
        retrieved: 2026-10-23
        covers: retention, ZDR, training
      - url: https://docs.cortecs.ai/security-and-compliance/sovereign-cloud
        retrieved: 2026-10-23
        covers: location
      - url: https://docs.cortecs.ai/security-and-compliance/data-governance-and-controls
        retrieved: 2026-10-23
        covers: location, training
