[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# The URL is not set here on purpose: env.py reads it from GATEWAY_DATABASE_URL
# via gateway.config, so migrations and the running service can never disagree
# about which database they are pointed at.
sqlalchemy.url =

# Readable, sortable filenames.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
