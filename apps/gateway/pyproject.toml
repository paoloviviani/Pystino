[project]
name = "gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with accounting, quotas and policy"
readme = "README.md"
requires-python = ">=3.13"
license = "EUPL-1.2"
authors = [{ name = "Paolo Viviani" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",       # brings uvloop + httptools
    "httpx>=0.28",                   # see https://example.invalid/viviani/ai-stack/-/blob/main/docs/adr/0013-upstream-http-client.md
    "sqlalchemy[asyncio]>=2.0.36,<2.1",  # 2.1 is beta as of 2026-08; do not ship it
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",                    # protocol client; talks to Valkey. ADR 0006
    "joserfc>=1.0",                  # JOSE/JWT. authlib.jose is deprecated. ADR 0011
    "pwdlib[argon2]>=0.2",           # password hashing for local login. ADR 0043
    "orjson>=3.10",
    "llmp-shared",
    "google-re2>=1.1.20251105",
    # The vector column type and its asyncpg codec, nothing more — MIT, and it
    # declares no dependencies of its own (verified at source, 0.5.0). It is a
    # binding, not an engine: the index and the distance operators are
    # PostgreSQL's (ADR 0018).
    "pgvector>=0.4",
    # What FastAPI needs to parse a multipart body, and the only reason there is
    # a multipart body is `POST /v1/files`. Apache-2.0, no dependencies of its
    # own (verified at source, 0.0.32). Without it FastAPI refuses to *build*
    # the route, at import time — so this is not an optional extra.
    "python-multipart>=0.0.20",
    # MIT. Already present at runtime through uvicorn[standard]; declared
    # because `pystino adopt` reads the old installer's generated Authelia YAML
    # and should not depend on another package's extras to do it.
    "pyyaml>=6.0",
]

[project.scripts]
gateway = "gateway.cli:main"
# Deployment: init, bootstrap, doctor (ADR 0086).
pystino = "gateway.deploy.cli:main"

[tool.uv.sources]
llmp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
