# Workspace root. This is a "virtual" root: it is not itself an installable
# package, it only ties the Python members together and holds shared tool config.
[tool.uv.workspace]
members = ["apps/gateway", "packages/shared-py"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
    # The documentation site (mkdocs.yml at the root; `uv run mkdocs build
    # --strict`). Lives in dev rather than its own group on purpose: the
    # gateway image syncs with --no-dev, which already excludes this group,
    # and a separate group would need its own exclusion there — plus it would
    # vanish from a plain `uv sync`, breaking the next `uv run mkdocs`.
    # mkdocs-material is MIT, mkdocs is BSD-2-Clause — checked against the
    # installed metadata on 2026-08-31 (ADR 0001's inbound licence policy).
    "mkdocs-material>=9.7",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
# Globs, not bare path fragments: the members are nested under apps/ and
# packages/, so "migrations/versions" would never match.
extend-exclude = [".venv", "**/migrations/versions/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async: catches blocking calls in async defs
    "S",    # bandit
]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Test credentials are not secrets, and test modules import their own helpers
# by bare module name (pytest puts the test directory on sys.path).
"**/tests/**" = ["S105", "S106", "S311"]
# These two run the opencode setup script as a subprocess, which is the thing
# under test: bash and a fixed script path, and the same blocking call inside an
# async test (the fake gateway is a thread, so nothing waits on the event loop).
"**/tests/test_opencode_install.py" = ["S603", "S606", "S607", "ASYNC221"]
"**/tests/test_client_scripts_route.py" = ["S603", "S607", "ASYNC221"]
# A one-shot CLI has no concurrency to block, so reading a file with pathlib
# inside an async entry point is not the bug ASYNC240 is warning about.
"**/scripts/**" = [
    "S101",
    "ASYNC240",
    # Every URL opened in scripts/ is a hardcoded http://localhost constant in a
    # development-only driver, not user input.
    "S310",
]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ['migrations/versions/.*']

[[tool.mypy.overrides]]
# These ship no type information as of the versions pinned in apps/gateway.
# `re2` is Google's RE2 binding, used for operator-written patterns because it
# cannot backtrack — see ADR 0038 and the measurement in it.
module = ["joserfc.*", "redis.*", "re2.*", "yaml.*", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Not installed in the workspace environment on purpose: services/redaction is a
# separate project so that spaCy never enters the gateway's dependency tree. The
# service narrows what it uses to a Protocol (llmp_redaction.detector.Analyzer),
# so the untyped import is confined to one function.
module = ["presidio_analyzer.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The same situation as presidio_analyzer above, for the document extractors:
# they are services/redaction's dependencies, and putting markitdown's
# 37-package tree (onnxruntime, pandas, magika) into the gateway's lockfile to
# satisfy a type checker would be the tail wagging the dog. `docx`, `openpyxl`
# and `pptx` appear only in that service's tests, where they *write* the
# fixtures the extractor then reads.
module = ["markitdown.*", "pdfminer.*", "docx.*", "openpyxl.*", "pptx.*", "pypdfium2.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# services/redaction is not a workspace member (it must not put spaCy in the
# gateway's lockfile), but its tests fake the analyzer and import Presidio
# nowhere, so they run here rather than rotting in a corner nobody executes.
testpaths = [
    "apps/gateway/tests",
    "packages/shared-py/tests",
    "services/redaction/tests",
]
pythonpath = [
    "apps/gateway/src",
    "packages/shared-py/src",
    "services/redaction/src",
]
filterwarnings = [
    "error",
    # SQLAlchemy warns that SQLite cannot store Numeric natively. We only use
    # SQLite in tests, and money columns go through the Money TypeDecorator
    # which round-trips Decimal as text. See apps/gateway/src/gateway/types.py
    "ignore::sqlalchemy.exc.SAWarning",
    # Starlette's TestClient warns about httpx on *import*, so this cannot be a
    # per-module marker: the error happens during collection, before any marker
    # applies. Third-party and unactionable here — the replacement it names
    # (httpx2) is not what FastAPI's own test client uses yet.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
